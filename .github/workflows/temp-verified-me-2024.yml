name: One-time verified 2024 ME results PR preparation
on:
  push:
    branches:
      - verified-me-2024-finals-20261111
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout proposal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Merge seven verified event results, with duplicate guards
        run: node scripts/apply-verified-me-2024-finals.cjs
      - name: Remove transient loader files from proposed changes
        run: |
          git rm data/verified-me-2024-finals-20261111.json
          git rm scripts/apply-verified-me-2024-finals.cjs
          git rm .github/workflows/temp-verified-me-2024.yml
      - name: Validate and run unit tests
        run: |
          npm run validate
          npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run PC and mobile browser tests
        run: npm run test:e2e
      - name: Commit only the verified data changes to proposal branch
        run: |
          set -euo pipefail
          git add results.json players.json tournaments.json updates.json
          git diff --cached --stat
          git diff --cached --quiet && { echo 'No changes to propose'; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: add 7 verified ME Trios/Squads finals for 2024"
          git push origin HEAD:verified-me-2024-finals-20261111
