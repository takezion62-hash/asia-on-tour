name: One-shot verified S36 NAW Squid Grounds ingest
on:
  push:
    branches: ['data/20261115-s36-squid-seven']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: squid-20261115
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Source verification and non-mutating trial
        run: |
          node scripts/source-results-store.cjs verify
          node scripts/apply-s36-squid-seven.cjs --dry-run
      - name: Add seven verified duos and rename canonical player
        run: node scripts/apply-s36-squid-seven.cjs
      - name: Regenerate canonical read models
        run: |
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Verify all mandatory data and season checks
        run: |
          node scripts/source-results-store.cjs verify
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          npm run validate
          node --test tests/data-validation.test.cjs tests/approval-history.test.cjs tests/source-results-store.test.cjs tests/rankings.test.cjs
      - name: Commit reviewed data only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A source-results season-data players.json approval-history.json updates.json candidate-triage.json
          if git diff --cached --quiet; then
            echo 'No data change after safe dry run'
            exit 0
          fi
          git commit -m 'data: publish S36 NAW Squid Grounds 7 duos and いずべすと rename'
          git push origin HEAD:data/20261115-s36-squid-seven
