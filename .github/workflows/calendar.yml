name: Tournament calendar smoke tests

on:
  # Full push/PR coverage is owned by tests.yml; this focused check is on demand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calendar:
    name: Calendar PC and mobile browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate published JSON
        run: npm run validate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Calendar interaction checks
        run: npx playwright test tests/calendar.spec.cjs
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: calendar-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
