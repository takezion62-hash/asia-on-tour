name: AOT correct 3peace Job NAC 702nd placement
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/correct-20261107-3peace-job-rank.yml"
      - "scripts/correct-20261107-3peace-job-rank.cjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  verify-and-correct:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout latest main and public records
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify saved Epic scoreboard and correct ONLY the existing rank
        run: |
          node --check scripts/correct-20261107-3peace-job-rank.cjs
          node scripts/correct-20261107-3peace-job-rank.cjs
      - name: Validate all source data and individual prize totals
        run: npm run validate
      - name: Run historical score and duplicate-safety regression tests
        run: node --test tests/osirion-sync.test.cjs tests/verified-history-approval.test.cjs tests/approval-history.test.cjs
      - name: Commit only confirmed correction and close matching review candidate
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json history-sync-reviewed.json history-sync-status.json updates.json
          if git diff --cached --quiet; then
            echo 'Already corrected, no changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: correct 3peace Job NAC Performance rank to 702'
          for attempt in 1 2 3; do
            git pull --rebase origin main || {
              git rebase --abort || true
              echo 'Concurrent correction conflict - preserve existing data'
              exit 1
            }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
