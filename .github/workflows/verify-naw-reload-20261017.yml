name: Publish source-confirmed NAW Reload 2026-10-17 trio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-naw-reload-20261017.yml'
      - 'scripts/verify-and-archive-naw-reload-20261017.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-participation-main
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify Epic leaderboard and safely publish participation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/verify-and-archive-naw-reload-20261017.cjs
            npm run validate
            node --test tests/participation-sync.test.cjs tests/participation-pr.test.cjs
            git add players.json participation/ participation-index.json updates.json
            if git diff --cached --quiet; then
              echo "NAW_RELOAD_ALREADY_PUBLISHED all verified entries already present"
              exit 0
            fi
            git commit -m "data: verify and archive NAW Reload VC RyoIT Rozu Sirusu"
            if git push origin HEAD:main; then
              echo "NAW_RELOAD_COMMITTED_WITH_VERIFICATION"
              exit 0
            fi
            echo "Main advanced; retry from latest and avoid duplicate entries"
            sleep $((attempt * 3))
          done
          echo "::error::Publication could not be safely reconciled"
          exit 1
