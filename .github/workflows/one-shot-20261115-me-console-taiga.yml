name: Temporary S31 ME Console Reload + S42 Taiga verified correction
on:
  push:
    branches:
      - data/20261115-me-console-reload-taiga-correction
    paths:
      - '.github/workflows/one-shot-20261115-me-console-taiga.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-shot-me-console-taiga-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 元データ検証と読み込み
        run: node scripts/source-results-store.cjs verify
      - name: ユーザー画像・本人Epic ID・重複・既存たいがレコードの独立確認
        run: node scripts/one-shot-20261115-me-console-reload-taiga.cjs --dry-run
      - name: 成績を追記したいがを同じIDで正しく修正
        run: node scripts/one-shot-20261115-me-console-reload-taiga.cjs
      - name: 公開用シーズン索引と候補索引の再生成
        run: |
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: 賞金・本人ID・大会・重複・元データチェックサムの必須検証
        run: |
          node scripts/validate-data.cjs
          node scripts/validate-approvals.cjs
          node scripts/validate-updates.cjs
          node scripts/source-results-store.cjs verify
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/data-validation.test.cjs tests/approval-history.test.cjs tests/source-results-store.test.cjs tests/session-date-consistency.test.cjs tests/tournament-rules.test.cjs tests/final-round-consistency.test.cjs
      - name: 修正したデータだけを作業ブランチへ反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tournaments.json candidate-triage.json
          git add -A source-results season-data
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo '::error::No data updated; refuse silent successful one-shot'
            exit 1
          fi
          git commit -m 'data: add 2024 ME console Reload duo and correct Taiga 2026 NAW final'
          git push origin HEAD:data/20261115-me-console-reload-taiga-correction
