name: Materialize 18 original Epic account verified results
on:
  push:
    branches: [data/publish-rescanned-18-20261118]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate original source pages, exact Epic account identities, and duplicate-free dry run
        run: node scripts/publish-rescanned-18-20261118.cjs --dry-run
      - name: Write 18 source-locked results and rebuild season and pending indexes
        run: |
          node scripts/publish-rescanned-18-20261118.cjs
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Verify immutable sources, all published data and 18 protected regression tests
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/verified-rescanned-18-20261118.test.cjs
      - name: Commit only exact verified results, approvals, review log and derived indexes
        shell: bash
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add history-sync-review.json history-sync-reviewed.json history-sync-status.json
          git add approval-history.json updates.json candidate-triage.json
          git diff --cached --name-only | tee /tmp/source-publish-files.txt
          if grep -Ev '^(source-results/|season-data/|history-sync-review\.json$|history-sync-reviewed\.json$|history-sync-status\.json$|approval-history\.json$|updates\.json$|candidate-triage\.json$)' /tmp/source-publish-files.txt; then
            echo "::error::Unexpected file change in source publication"
            exit 1
          fi
          test -s /tmp/source-publish-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 18 source-verified original Epic records with zero cash [skip ci]"
          git push origin HEAD:data/publish-rescanned-18-20261118
