name: AOT audit Unreal NAW 122nd prize and OCE voided session
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-20261107-unreal-na-west-voided.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check audit syntax
        run: node --check scripts/manual-review-20261107-unreal-na-west-voided.cjs
      - name: Verify exact rank and remove only voided review entries
        run: node scripts/manual-review-20261107-unreal-na-west-voided.cjs
      - name: Check all site results, payouts and review ledger
        run: npm run validate
      - name: Check Unreal payout safety
        run: node --test tests/automatic-unreal-approval.test.cjs tests/approval-history.test.cjs tests/verified-history-approval.test.cjs
      - name: Commit completed verification without overwriting other updates
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json history-sync-reviewed.json history-sync-status.json updates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'data: confirm Unreal NAW duo cash and exclude voided PlayStation session'
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
