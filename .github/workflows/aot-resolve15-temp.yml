name: Temporary remaining-15 evidence diagnostic
on:
  push:
    branches: [feat/resolve-remaining-15-20261113]
    paths:
      - .github/workflows/aot-resolve15-temp.yml
      - scripts/resolve15-diagnostic-temp.cjs
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/resolve15-diagnostic-temp.cjs
