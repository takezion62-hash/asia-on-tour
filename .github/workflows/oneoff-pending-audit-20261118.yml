name: One-off bulk pending evidence audit
on:
  push:
    branches: [data/pending-bulk-review-20261118]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Evaluate all existing safe review policies (no writes)
        run: node scripts/audit-all-pending-20261118.cjs
