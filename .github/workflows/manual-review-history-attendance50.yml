name: AOT resolve historical attendance and cosmetic 2026-11-07
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-history-attendance50.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the latest reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source code syntax
        run: node --check scripts/manual-review-history-20261107-attendance50.cjs
      - name: Check 50 exact leaderboard rows and official award cutoffs
        run: node scripts/manual-review-history-20261107-attendance50.cjs
      - name: Validate ASIA ON TOUR datasets
        run: npm run validate
      - name: Regression tests for approval and historical sync
        run: node --test tests/verified-history-approval.test.cjs tests/approval-history.test.cjs
      - name: Publish verified changes with concurrent-write protection
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json history-sync-reviewed.json history-sync-status.json updates.json
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish verified historical attendance and cosmetic results"
          for attempt in 1 2 3; do
            git pull --rebase origin main || {
              git rebase --abort || true
              echo "::error::Rebase conflict. Do not overwrite concurrent data."
              exit 1
            }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
