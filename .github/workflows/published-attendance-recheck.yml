name: AOT published attendance recheck
on:
  pull_request:
    paths:
      - 'scripts/published-attendance*.cjs'
      - 'tests/published-attendance*.cjs'
      - '.github/workflows/published-attendance-recheck.yml'
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview only, without publishing changes'
        type: boolean
        default: true
      confirmation:
        description: 'Type CONFIRM to prepare a data correction branch'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  preview:
    if: github.event_name == 'pull_request' || inputs.preview_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Recheck saved attendance with no provider calls
        run: |
          node scripts/published-attendance-phase5.cjs --dry-run > phase5-preview.json
          node -e "const r=require('./phase5-preview.json');console.log(JSON.stringify({attendance:r.attendance,checked:r.checked,proposed:r.proposed,totalChanges:r.totalChanges,additionalProviderRequests:r.additionalProviderRequests}))" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: phase5-preview
          path: phase5-preview.json
          retention-days: 14
  prepare:
    if: github.event_name == 'workflow_dispatch' && !inputs.preview_only
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require trusted main and explicit approval
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = CONFIRM
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Prepare validated correction on local checkout
        env:
          AOT_PHASE5_CONFIRMATION: CONFIRM
        run: |
          git rev-parse HEAD > .phase5-base
          node scripts/published-attendance-phase5.cjs --apply > phase5-preview.json
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
          node scripts/build-source-results.cjs --check
          npm run validate
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/published-attendance-recheck.test.cjs tests/published-attendance-phase5.test.cjs tests/approval-history.test.cjs tests/update-history.test.cjs
      - name: Propose data-only branch, never merge automatically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add updates.json candidate-triage.json
          for f in published-attendance-phase5-history.json attendance-award-recheck-history.json; do
            if [[ -f "$f" ]]; then git add "$f"; fi
          done
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No verified changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin main
          BASE="$(cat .phase5-base)"
          test "$(git rev-parse origin/main)" = "$BASE"
          BRANCH="reviewed-results/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "review: published attendance corrections"
          git push -u origin "$BRANCH"
          if gh pr create --base main --head "$BRANCH" --title "Review: Phase 5 published attendance corrections" --body "Offline evidence replay; existing IDs and registration history preserved. Review CI before merging."; then
            gh workflow run tests.yml --ref "$BRANCH" -f "review_base_sha=$BASE"
          else
            echo "::warning::PR creation failed; data branch preserved for connected GitHub App review: $BRANCH"
            echo "https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: phase5-correction-report
          path: phase5-preview.json
          if-no-files-found: ignore
          retention-days: 14
