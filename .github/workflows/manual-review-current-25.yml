name: AOT publish 25 individually reviewed candidates (2026-11-06)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-current-25.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  publish-verified-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout fresh main data
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm saved candidate IDs, official windows and prize conditions
        run: node scripts/manual-review-current-25-run.cjs
      - name: Check data quality, logs and approval integrity
        run: npm run validate
      - name: Run source-aware unit regression tests
        run: npm run test:unit
      - name: Commit all reviewed results as one atomic change
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json auto-sync-review.json \
            history-sync-reviewed.json approval-history.json history-sync-status.json \
            auto-sync-status.json updates.json data/manual-approvals/20261106-current-25-audit.json
          if git diff --cached --quiet; then
            echo "Already published; no JSON changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 23 verified candidates; resolve 2 duplicates"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Concurrent change conflict. Do not overwrite current records."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Review publication pushed to main with CI validations"
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::error::Unable to safely publish validated candidate results"
          exit 1
