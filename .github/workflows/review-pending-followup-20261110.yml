name: Verify and publish pending ASIA ON TOUR follow-up 2026-11-10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-pending-followup-20261110.yml'
      - 'scripts/review-pending-followup-20261110.cjs'
      - 'scripts/resolve-skin-collisions-20261110.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Inspect and safely publish verified pending participation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node --check scripts/review-pending-followup-20261110.cjs
            node scripts/review-pending-followup-20261110.cjs --audit
            node scripts/review-pending-followup-20261110.cjs
            node scripts/resolve-skin-collisions-20261110.cjs --dry-run
            node scripts/resolve-skin-collisions-20261110.cjs
            npm run validate
            node --test tests/participation-sync.test.cjs tests/participation-ui.test.cjs tests/safe-sync-merge.test.cjs
            git add results.json updates.json auto-sync-review.json history-sync-review.json auto-sync-status.json history-sync-status.json history-sync-reviewed.json participation participation-index.json
            if git diff --cached --quiet; then
              echo "AOT_FOLLOWUP_NO_SAFE_NEW_RESULTS"
              exit 0
            fi
            git commit -m "data: source-verify and publish newly pending AOT results"
            if git push origin HEAD:main; then
              echo "AOT_FOLLOWUP_COMMITTED_AND_VALIDATED"
              exit 0
            fi
            sleep $((attempt*3))
          done
          echo "::error::Cannot safely reconcile concurrent publication"
          exit 1
