name: Temporary ingest 10 screenshot-verified ME results
on:
  push:
    branches: [data/20261115-me-s26-s39-s40-ten-results]
    paths:
      - '.github/workflows/one-shot-20261115-me-ten.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-shot-me-ten-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    name: 10成績の本人ID・金額照合と安全な登録
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 正本を検証
        run: node scripts/source-results-store.cjs verify
      - name: 独立のスクリーンショット証拠と重複・UUID・名義チェック
        run: node scripts/one-shot-20261115-me-ten-s26-s39-s40.cjs --dry-run
      - name: 新規10件と選手の別名・大会定義を安全登録
        run: node scripts/one-shot-20261115-me-ten-s26-s39-s40.cjs
      - name: ランキングと公開用索引を再生成
        run: |
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: JSON・賞金・本人ID・過去大会と新旧索引を検証
        run: |
          node scripts/validate-data.cjs
          node scripts/validate-approvals.cjs
          node scripts/validate-updates.cjs
          node scripts/source-results-store.cjs verify
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/data-validation.test.cjs tests/approval-history.test.cjs tests/source-results-store.test.cjs tests/session-date-consistency.test.cjs tests/tournament-rules.test.cjs tests/final-round-consistency.test.cjs tests/tournament-publication-unification.test.cjs
      - name: 追加・再生成したデータだけを作業ブランチへコミット
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add players.json tournaments.json candidate-triage.json
          git add -A source-results season-data
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo '::error::Expected 10 additional confirmed results'
            exit 1
          fi
          git commit -m 'data: publish ten ME cash results from 2023 and 2026'
          git push origin HEAD:data/20261115-me-s26-s39-s40-ten-results
