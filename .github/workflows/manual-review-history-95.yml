name: AOT manually verified 95 historical candidates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-history-95.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  approve-historical-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit all 95 rows and publish only individually verified records
        run: node scripts/manual-review-history-95.cjs
      - name: Validate site records and historical review ledger
        run: |
          npm run validate
          node --test tests/verified-history-approval.test.cjs tests/osirion-sync.test.cjs
      - name: Commit verified record additions without overwriting concurrent work
        run: |
          git add results.json updates.json history-sync-review.json history-sync-reviewed.json history-sync-status.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 77 verified past results and resolve 18 exact duplicates"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || {
              git rebase --abort || true
              echo "Conflict: leave originals safe for review"
              exit 1
            }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 4))
          done
          exit 1
