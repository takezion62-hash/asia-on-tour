name: Temporary AOT 37 evidence audit
on:
  push:
    branches: [feat/publish-reviewed-37-fast-20261113]
    paths:
      - scripts/aot-audit-37-temp.cjs
      - .github/workflows/aot-audit-37-temp.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/aot-audit-37-temp.cjs
