name: AOT CI and deployment timing
on:
  workflow_run:
    workflows:
      - Data and site tests
      - pages build and deployment
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run is privileged: only trusted main code is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Record queue, unit, PC/mobile and deployment runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/review-timing.cjs
      - name: Preserve inspectable timing JSON for 30 days
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aot-runtime-${{ github.event.workflow_run.id }}
          path: timing-reports/
          retention-days: 30
          if-no-files-found: ignore
