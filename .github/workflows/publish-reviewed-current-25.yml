name: AOT publish reviewed 25 candidate results
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-reviewed-current-25.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-verified-25-priority
  cancel-in-progress: false
jobs:
  publish-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Cross-check all 25 candidates and produce 23 safe records
        run: node scripts/manual-review-current-25-run.cjs
      - name: Validate data references, earnings, update and approval history
        run: npm run validate
      - name: Run all unit regressions before commit
        run: node --test tests/manual-approval.test.cjs tests/approval-history.test.cjs tests/verified-history-approval.test.cjs tests/osirion-sync.test.cjs
      - name: Commit review audit and validated results to main
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json auto-sync-review.json history-sync-reviewed.json approval-history.json history-sync-status.json auto-sync-status.json updates.json data/manual-approvals/20261106-current-25-audit.json
          if git diff --cached --quiet; then
            echo "Already processed. No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 23 verified candidates and resolve 2 duplicates"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || {
              git rebase --abort || true
              echo "Conflict; leave results untouched rather than overwrite"
              exit 1
            }
            if git push origin HEAD:main; then
              echo "Verified results published to main"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
