name: One-time verified qualification migration
on:
  push:
    branches:
      - fix/merge-verified-participation-into-results-20261110
    paths:
      - scripts/import-verified-participation-20261110.cjs

permissions:
  contents: write

concurrency:
  group: aot-one-time-qualification-migration
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge verified historical appearances into results
        run: node scripts/import-verified-participation-20261110.cjs
      - name: Validate all records and history
        run: |
          node scripts/validate-data.cjs
          node scripts/validate-updates.cjs
          node --test tests/participation-sync.test.cjs tests/update-history.test.cjs
      - name: Commit generated records only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json updates.json
          if git diff --cached --quiet; then
            echo "No new rows to publish"
          else
            git commit -m "data: publish verified qualification and final placements"
            git push origin HEAD:fix/merge-verified-participation-into-results-20261110
          fi
