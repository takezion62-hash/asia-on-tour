name: One-off verified 24 historical entries
on:
  push:
    branches: [data/verified-remaining-s33-s35-s37-24-20261118]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify source proofs, calendar dates, UUIDs, duplicates, official prize rules
        run: node scripts/publish-verified-s33-s35-s37-24-20261118.cjs --dry-run
      - name: Materialize exactly 24 zero-or-unverified-cash records
        run: |
          node scripts/publish-verified-s33-s35-s37-24-20261118.cjs
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Validate the complete canonical dataset and all 24 tamper guards
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/verified-remaining-s33-s35-s37-24-20261118.test.cjs
      - name: Commit only reviewed data and indexes, never the temporary publisher
        shell: bash
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add history-sync-review.json history-sync-status.json approval-history.json updates.json candidate-triage.json
          git diff --cached --name-only | tee /tmp/canonical-files.txt
          if grep -Ev '^(source-results/|season-data/|history-sync-review\.json$|history-sync-status\.json$|approval-history\.json$|updates\.json$|candidate-triage\.json$)' /tmp/canonical-files.txt; then
            echo "::error::Unplanned source modification"
            exit 1
          fi
          test -s /tmp/canonical-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: materialize 24 proof-backed S33/S35/S37 results [skip ci]"
          git push origin HEAD:data/verified-remaining-s33-s35-s37-24-20261118
