name: AOT correct Unreal Cup duo personal cash award
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-unreal-oce-duo-personal-payout.yml"
      - "scripts/fix-unreal-oce-duo-personal-payout.cjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax
        run: node --check scripts/fix-unreal-oce-duo-personal-payout.cjs
      - name: Correct team and individual prizes using Epic and Tracker
        run: node scripts/fix-unreal-oce-duo-personal-payout.cjs
      - name: Validate all site data and money
        run: npm run validate
      - name: Verify personal prize exactly 50 dollars each
        run: |
          node - <<'NODE'
          const a=require('node:assert/strict'),j=require('./results.json');
          const x=j.find(r=>r.id==='auto-s39-4d5f1e94f897');
          a.deepEqual([x.prize,x.prizePerPlayer,x.players.length],[100,50,2]);
          a.equal(require('./scripts/data-checks.cjs').personalCents(x),5000);
          console.log('Two-player payout arithmetic validated');
          NODE
      - name: Commit corrected prize safely
        run: |
          set -euo pipefail
          git add results.json updates.json history-sync-reviewed.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'data: credit $50 to each Unreal Cup duo player from team $100'
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
