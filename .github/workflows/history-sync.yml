name: AOT historical rule-verified result approval
on:
  push:
    branches: [main]
    paths:
      - "scripts/osirion-sync.cjs"
      - "scripts/verified-history-approval.cjs"
      - "scripts/auto-sync-core.cjs"
      - "scripts/automatic-cosmetic-approval.cjs"
      - "scripts/cosmetic-rank-rules.cjs"
      - "tests/verified-history-approval.test.cjs"
      - "tests/non-victory-auto-sync.test.cjs"
      - "tests/automatic-cosmetic-approval.test.cjs"
      - "tests/osirion-sync.test.cjs"
      - "history-sync-config.json"
      - ".github/workflows/history-sync.yml"
  schedule:
    - cron: '41 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize recent and historical writers of results.json/updates.json.
  # Never let simultaneous push-triggered scans race on a JSON rebase.
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  review-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delay historical API calls
        run: sleep 35
      - name: Scan historical Osirion tournaments and approve verified results
        run: node scripts/osirion-sync.cjs --history
      - name: Validate unchanged public data and tests
        run: |
          npm run validate
          node --test tests/auto-sync.test.cjs tests/osirion-sync.test.cjs tests/non-victory-auto-sync.test.cjs tests/verified-history-approval.test.cjs tests/automatic-cosmetic-approval.test.cjs tests/cosmetic-rank-rules.test.cjs
      - name: Commit only verified results and review state
        run: |
          if [ -z "$(git status --porcelain -- results.json updates.json history-sync-status.json history-sync-review.json history-sync-scan.json)" ]; then
            echo "No historical review changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json updates.json history-sync-status.json history-sync-review.json history-sync-scan.json
          git commit -m "data: save historical AOT review candidates"
          # Race-safe, bounded retry: integrate other bots' commits, never force push.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || {
              git rebase --abort || true
              echo "Rebase conflict: preserve both histories and require review"
              exit 1
            }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote advanced between pull and push; retrying ($attempt/5)"
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 safe retries"
          exit 1
