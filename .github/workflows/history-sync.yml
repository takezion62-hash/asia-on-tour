name: AOT historical rule-verified result approval
on:
  # Test-only changes are verified by tests.yml; they must not re-scan the provider.
  push:
    branches: [main]
    paths:
      - "scripts/osirion-sync.cjs"
      - "scripts/automatic-duo-qualifier-approval.cjs"
      - "scripts/verified-partial-page.cjs"
      - "scripts/audit-pending-history-20261108.cjs"
      - "scripts/publish-verified-s35-console-duos-20261108.cjs"
      - "scripts/publish-verified-qualifier-batch.cjs"
      - "scripts/publish-verified-nov11-pending.cjs"
      - "scripts/publish-verified-fncs-performance-days.cjs"
      - "scripts/publish-verified-final4-persona.cjs"
      - "scripts/publish-extra-verified-nov11.cjs"
      - "scripts/publish-verified-nov11-round2.cjs"
      - "scripts/squads-qualifier-rules.cjs"
      - "scripts/publish-verified-nov11-round3.cjs"
      - "scripts/publish-verified-review-round5.cjs"
      - "scripts/publish-verified-legacy-finals-and-duplicates.cjs"
      - "scripts/publish-verified-nov12-pending.cjs"
      - "scripts/reconcile-exact-epic-rank-three.cjs"
      - ".github/workflows/history-sync.yml"
      - "scripts/publish-verified-finals-batch.cjs"
      - "scripts/publish-reviewed-s30-nac-zero-vr.cjs"
      - "scripts/scan-coverage.cjs"
      - "scripts/safe-sync-merge.cjs"
      - "scripts/verified-history-approval.cjs"
      - "scripts/auto-sync-core.cjs"
      - "scripts/automatic-cosmetic-approval.cjs"
      - "scripts/automatic-cash-approval.cjs"
      - "scripts/automatic-unreal-approval.cjs"
      - "scripts/automatic-performance-approval.cjs"
      - "tournament-rules.json"
      - "scripts/validate-tournament-rules.cjs"
      - "scripts/cosmetic-rank-rules.cjs"
      - "history-sync-config.json"
      - ".github/workflows/history-sync.yml"
  schedule:
    - cron: '41 1,5,9,13,17,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize recent and historical writers of results.json/updates.json.
  # Never let simultaneous push-triggered scans race on a JSON rebase.
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  review-history:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish verified 2024 finals and Lady Liberty pending rows to newest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-verified-nov12-pending.cjs --dry-run
            node scripts/publish-verified-nov12-pending.cjs
            npm run validate
            node --test tests/manual-approval.test.cjs tests/approval-history.test.cjs tests/cosmetic-rank-rules.test.cjs tests/tournament-rules.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json history-sync-review.json history-sync-reviewed.json approval-history.json history-sync-status.json updates.json participation-index.json participation-status.json participation/2026-10.json participation/2024-09.json
            if git diff --cached --quiet; then
              echo "NOV12_VERIFIED no further pending rows"
              break
            fi
            git commit -m "data: publish 7 official results and archive 41 verified attendance rows"
            if git push origin HEAD:main; then
              echo "NOV12_VERIFIED published to main"
              break
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "::error::NOV12_VERIFIED failed safe main update; original source intact"
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Publish exact saved 2024-2026 pending result reviews without uncertain cash
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-verified-cosmetic-pending.cjs --dry-run
            node scripts/publish-verified-cosmetic-pending.cjs
            node scripts/publish-verified-cash-playstation-pending.cjs --dry-run
            node scripts/publish-verified-cash-playstation-pending.cjs
            node scripts/publish-verified-fncs-performance-days.cjs --dry-run
            node scripts/publish-verified-fncs-performance-days.cjs
            node scripts/publish-verified-nov11-pending.cjs --dry-run
            node scripts/publish-verified-nov11-pending.cjs
            node scripts/publish-verified-final4-persona.cjs --dry-run
            node scripts/publish-verified-final4-persona.cjs
            node scripts/publish-extra-verified-nov11.cjs --dry-run
            node scripts/publish-extra-verified-nov11.cjs
            node scripts/publish-verified-nov11-round2.cjs --dry-run
            node scripts/publish-verified-nov11-round2.cjs
            node scripts/publish-verified-nov11-round3.cjs --dry-run
            node scripts/publish-verified-nov11-round3.cjs
            node scripts/publish-verified-review-round5.cjs --dry-run
            node scripts/publish-verified-review-round5.cjs
            node scripts/publish-verified-legacy-finals-and-duplicates.cjs --dry-run
            node scripts/publish-verified-legacy-finals-and-duplicates.cjs
            node scripts/reconcile-exact-epic-rank-three.cjs --dry-run
            node scripts/reconcile-exact-epic-rank-three.cjs
            npm run validate
            node --test tests/manual-approval.test.cjs tests/approval-history.test.cjs tests/cosmetic-rank-rules.test.cjs tests/tournament-rules.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json updates.json history-sync-review.json history-sync-reviewed.json history-sync-status.json auto-sync-review.json auto-sync-status.json approval-history.json
            if git diff --cached --quiet; then
              echo "AOT_VERIFIED_NOV11 no new source-verified results to publish"
              break
            fi
            git commit -m "data: publish source-verified pending results to main and preserve prior awards"
            if git push origin HEAD:main; then
              echo "AOT_VERIFIED_NOV11 published results to main"
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "::error::Verification replay conflicted with main; no unsafe overwrite"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Publish ranked September S42 cosmetics from verified pending review
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-verified-cosmetic-pending.cjs --dry-run
            node scripts/publish-verified-cosmetic-pending.cjs
            npm run validate
            node --test tests/manual-approval.test.cjs tests/automatic-cosmetic-approval.test.cjs tests/tournament-rules.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json auto-sync-review.json history-sync-review.json auto-sync-status.json history-sync-status.json approval-history.json updates.json
            if git diff --cached --quiet; then
              echo "VERIFIED_COSMETIC_REVIEW no new approved records"
              break
            fi
            git commit -m "data: publish verified S42 cosmetic results into the main result feed"
            if git push origin HEAD:main; then
              echo "VERIFIED_COSMETIC_REVIEW published on main"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Could not safely publish verified S42 candidates"
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Publish exact verified 2024 ME/OCE Solo qualifiers (safe, repeatable)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "VERIFIED_QUALIFIERS attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-verified-qualifier-batch.cjs --dry-run
            node scripts/publish-verified-qualifier-batch.cjs
            npm run validate
            node --test tests/publish-verified-qualifier-batch.test.cjs tests/safe-sync-merge.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json updates.json history-sync-review.json history-sync-reviewed.json history-sync-status.json approval-history.json participation-index.json
            git add -A participation/
            if git diff --cached --quiet; then
              echo "VERIFIED_QUALIFIERS no new rows"
              break
            fi
            git commit -m "data: publish official verified 2024 ME/OCE qualifier results and de-duplicate archive"
            if git push origin HEAD:main; then
              echo "VERIFIED_QUALIFIERS published to main"
              break
            fi
            if [ "${attempt}" -ge 5 ]; then
              echo "::error::verified qualifier batch could not be published safely"
              exit 1
            fi
            echo "main advanced; retry from current verified source without force push"
            sleep $((attempt * 3))
          done

      - name: Publish confirmed 2024-2025 final cash prizes with original Epic scoreboard
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            echo "VERIFIED_FINALS attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-verified-finals-batch.cjs --dry-run
            node scripts/publish-verified-finals-batch.cjs
            npm run validate
            node --test tests/publish-verified-finals-batch.test.cjs tests/safe-sync-merge.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json updates.json history-sync-review.json history-sync-reviewed.json history-sync-status.json approval-history.json participation-index.json
            git add -A participation/
            if git diff --cached --quiet; then
              echo "VERIFIED_FINALS no new records"
              break
            fi
            git commit -m "data: publish exact saved 2024-2025 finals and official VR payouts"
            if git push origin HEAD:main; then
              echo "VERIFIED_FINALS published to main"
              break
            fi
            if [ "${attempt}" -ge 5 ]; then
              echo "::error::verified cash finals could not be published"
              exit 1
            fi
            echo "Main advanced; reload and reverify before retrying"
            sleep $((attempt * 3))
          done

      - name: Audit historical candidates and original leaderboard checkpoints
        run: node scripts/audit-pending-history-20261108.cjs
      - name: Snapshot the original main before the historical provider scan
        run: node scripts/safe-sync-merge.cjs snapshot history "$RUNNER_TEMP/aot-history-base.json"
      - name: Delay historical API calls
        run: sleep 35
      - name: Scan historical Osirion tournaments and approve verified results
        run: node scripts/osirion-sync.cjs --history
      - name: Validate unchanged public data and tests
        run: |
          npm run validate
          node --test tests/auto-sync.test.cjs tests/osirion-sync.test.cjs tests/verified-partial-page.test.cjs tests/non-victory-auto-sync.test.cjs tests/verified-history-approval.test.cjs tests/automatic-cosmetic-approval.test.cjs tests/cosmetic-rank-rules.test.cjs tests/automatic-cash-approval.test.cjs tests/automatic-unreal-approval.test.cjs tests/automatic-performance-approval.test.cjs tests/tournament-rules.test.cjs
      - name: Preserve the verified scan output before refreshing main
        run: node scripts/safe-sync-merge.cjs snapshot history "$RUNNER_TEMP/aot-history-scanned.json"
      - name: Reconcile and commit verified history onto newest main (conflict-safe)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No git pull --rebase for generated JSON: each attempt starts from the
          # latest main and safely replays only this scan's verified additions.
          fresh_source_retries=0
          for attempt in 1 2 3 4 5 6; do
            echo "SAFE_HISTORY_MERGE attempt ${attempt}/6 (fresh-source rescans: ${fresh_source_retries})"
            git fetch origin main
            git reset --hard origin/main
            # Reject stale identity or prize rules before replaying provider results.
            # A changed input is NOT a merge conflict: re-run the provider scan
            # using the new main rather than loosening the source-hash guard.
            if node scripts/safe-sync-merge.cjs check-sources history "$RUNNER_TEMP/aot-history-base.json"; then
              :
            else
              check_code=$?
              if [ "$check_code" -ne 10 ]; then
                echo "::error::Source validation itself failed (${check_code})"
                exit "$check_code"
              fi
              if [ "$fresh_source_retries" -ge 1 ]; then
                echo "::error::Approval inputs changed again during the fresh scan; refusing unsafe publication"
                exit 1
              fi
              fresh_source_retries=$((fresh_source_retries + 1))
              echo "::notice::Player identity or rules changed during scan; discard stale output and re-scan from newest main"
              node scripts/safe-sync-merge.cjs snapshot history "$RUNNER_TEMP/aot-history-base.json"
              node scripts/osirion-sync.cjs --history
              npm run validate
              node --test tests/safe-sync-merge.test.cjs tests/verified-history-approval.test.cjs tests/automatic-unreal-approval.test.cjs
              node scripts/safe-sync-merge.cjs snapshot history "$RUNNER_TEMP/aot-history-scanned.json"
              continue
            fi
            node scripts/safe-sync-merge.cjs merge history "$RUNNER_TEMP/aot-history-base.json" "$RUNNER_TEMP/aot-history-scanned.json"
            npm run validate
            node --test tests/safe-sync-merge.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json updates.json history-sync-status.json history-sync-review.json history-sync-scan.json
            if git diff --cached --quiet; then
              echo "SAFE_HISTORY_MERGE no new data to publish"
              exit 0
            fi
            git commit -m "data: safely merge historical AOT sync into newest main"
            if git push origin HEAD:main; then
              echo "SAFE_HISTORY_MERGE published with existing history preserved"
              exit 0
            fi
            echo "Main moved during historical sync; replay changes onto newest main"
            sleep $((attempt * 3))
          done
          echo "SAFE_HISTORY_MERGE failed after 5 conflict-safe attempts"
          exit 1

      - name: Publish source-confirmed S35 zero-VR teams and close exact duplicates
        run: |
          set -euo pipefail
          # Only confirmed official May 2025 0VR/$0 teams, from a completed
          # 3-page Epic leaderboard, with archive/identity and collision checks.
          # Rebuild against latest main each attempt: no force push or JSON rebase.
          for attempt in 1 2 3 4 5; do
            echo "VERIFIED_HISTORY_PUBLICATION attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-verified-s35-console-duos-20261108.cjs --dry-run
            node scripts/publish-verified-s35-console-duos-20261108.cjs
            npm run validate
            node --test tests/publish-verified-s35-console-duos-20261108.test.cjs tests/safe-sync-merge.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json updates.json history-sync-review.json history-sync-reviewed.json history-sync-status.json
            if git diff --cached --quiet; then
              echo "VERIFIED_HISTORY_PUBLICATION already complete; no new rows"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: publish source-verified historical 0VR Console Duos and resolve duplicate candidates"
            if git push origin HEAD:main; then
              echo "VERIFIED_HISTORY_PUBLICATION committed to main"
              exit 0
            fi
            echo "Another writer updated main; re-evaluating against latest published rows"
            sleep $((attempt * 3))
          done
          echo "VERIFIED_HISTORY_PUBLICATION failed after 5 attempts"
          exit 1

      - name: Publish fully scanned S30 NAC 2024 Solo finals with 0VR and zero cash only
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "S30_VERIFIED_REVIEW_PUBLICATION attempt $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-reviewed-s30-nac-zero-vr.cjs --dry-run
            node scripts/publish-reviewed-s30-nac-zero-vr.cjs
            npm run validate
            node --test tests/publish-reviewed-s30-nac-zero-vr.test.cjs tests/safe-sync-merge.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json updates.json history-sync-review.json history-sync-reviewed.json history-sync-status.json
            if git diff --cached --quiet; then
              echo "S30_VERIFIED_REVIEW_PUBLICATION already complete or no newly confirmed rows"
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: add fully verified 2024 NAC Solo Victory Cash Cup 0VR finalists"
            if git push origin HEAD:main; then
              echo "S30_VERIFIED_REVIEW_PUBLICATION published with current results preserved"
              exit 0
            fi
            echo "Remote main advanced; reverify and integrate against latest published rows"
            sleep $((attempt * 3))
          done
          echo "S30_VERIFIED_REVIEW_PUBLICATION failed after conflict-safe retries"
          exit 1
