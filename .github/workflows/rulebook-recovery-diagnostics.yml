name: Isolated rulebook and promotion diagnostics
on:
  pull_request:
    paths:
      - 'tournament-rules.json'
      - 'source-rules.js'
      - 'scripts/**'
      - 'tests/tournament-rules.test.cjs'
      - 'tests/automatic-duo-qualifier-approval.test.cjs'
      - '.github/workflows/rulebook-recovery-diagnostics.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax checks for modified JS
        run: |
          node --check source-rules.js
          node --check scripts/automatic-duo-qualifier-approval.cjs
          node --check scripts/validate-tournament-rules.cjs
      - name: Official rulebook and verified duo round 1 independent tests
        run: node --test tests/tournament-rules.test.cjs tests/automatic-duo-qualifier-approval.test.cjs
      - name: Read-only four S43 historical award audit replay
        run: node scripts/diagnose-s43-promotion.cjs
