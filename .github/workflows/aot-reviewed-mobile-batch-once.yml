name: One-time reviewed mobile batch source publication
on:
  push:
    branches:
      - data/mobile-batch-20261122-evening
    paths:
      - .github/workflows/aot-reviewed-mobile-batch-once.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/data/mobile-batch-20261122-evening'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate source and publish exact vetted additions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/source-results-store.cjs verify
          node <<'NODE'
          'use strict';
          const fs=require('node:fs');
          const path=require('node:path');
          const {readResults,publishResults}=require('./scripts/source-results-store.cjs');
          const root=process.cwd();
          const read=name=>JSON.parse(fs.readFileSync(path.join(root,name),'utf8'));
          const write=(name,value)=>fs.writeFileSync(path.join(root,name),JSON.stringify(value,null,2)+'\n');
          const batch=read('.aot-mobile-import-20261122.json');
          if(batch.version!==1||!Array.isArray(batch.rows)||batch.rows.length!==10||
             batch.rows.reduce((sum,r)=>sum+r.prize,0)!==1050)throw Error('mobile batch payload mismatch');
          const current=readResults(root).rows;
          const existingIds=new Set(current.map(r=>r.id));
          const knownWindows=new Set(current.map(r=>r.region+'|'+r.source+'|'+r.profileUrl));
          const batchIds=new Set();
          for(const row of batch.rows){
            if(!row.verified||!row.source?.startsWith('https://fortnitetracker.com/events/')||
               !row.profileUrl?.startsWith('https://fortnitetracker.com/profile/all/')||
               !Number.isInteger(row.kills)||!Number.isInteger(row.vrs)||
               !Number.isInteger(row.rank)||!Number.isInteger(row.matches)||
               row.prizePerPlayer!==row.prize||row.teamPrize!==row.prize||
               existingIds.has(row.id)||batchIds.has(row.id)||
               knownWindows.has(row.region+'|'+row.source+'|'+row.profileUrl))throw Error('Invalid/duplicate vetted row: '+row.id);
            batchIds.add(row.id);
          }
          const tournaments=read('tournaments.json');
          if(!Array.isArray(tournaments.catalog))throw Error('missing tournament catalog');
          const catalogIds=new Set(tournaments.catalog.map(t=>t.id));
          for(const entry of batch.addTournamentCatalog){
            if(catalogIds.has(entry.id))throw Error('catalog ID already exists: '+entry.id);
            tournaments.catalog.push(entry);
            catalogIds.add(entry.id);
          }
          const mode=tournaments.axes.find(x=>x.key==='mode');
          if(!mode)throw Error('missing mode axis');
          if(!mode.options.some(x=>x.id===batch.addModeOption.id))mode.options.push(batch.addModeOption);
          const subtype=tournaments.axes.find(x=>x.key==='subtype');
          if(!subtype)throw Error('missing subtype axis');
          for(const option of batch.addSubtypeOptions){
            if(!subtype.options.some(x=>x.id===option.id))subtype.options.push(option);
          }
          for(const row of batch.rows)if(!catalogIds.has(row.tournamentId))throw Error('unknown tournament ID '+row.tournamentId);
          const players=read('players.json');
          if(players.candidates.some(x=>x.name===batch.addPlayer.name))throw Error('new player name already registered');
          players.candidates.push(batch.addPlayer);
          const updates=read('updates.json');
          if(updates.entries.some(x=>x.id===batch.history.id))throw Error('duplicate update history ID');
          if(JSON.stringify(batch.history.recordIds)!==JSON.stringify(batch.rows.map(x=>x.id)))throw Error('history ID mismatch');
          updates.entries.unshift(batch.history);
          write('tournaments.json',tournaments);
          write('players.json',players);
          write('updates.json',updates);
          const result=publishResults(root,[...current,...batch.rows],{legacyWriter:true});
          if(result.count!==current.length+10||!['S38','S39','S41','S42'].every(x=>result.changedShards.includes(x)))throw Error('unexpected published result summary '+JSON.stringify(result));
          console.log('REVIEWED_MOBILE_BATCH_PUBLISHED '+JSON.stringify(result));
          NODE
          node scripts/source-results-store.cjs verify
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
      - name: Commit canonical and generated data to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git add tournaments.json players.json updates.json source-results season-data candidate-triage.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing changed; refusing empty publication."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: publish 10 verified mobile results and regenerate indexes'
          git push origin HEAD:refs/heads/data/mobile-batch-20261122-evening
