name: AOT finish review of voided and already-listed candidates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-20261107-final-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  close-verified-review-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check audit source syntax
        run: node --check scripts/manual-review-20261107-final-audit.cjs
      - name: Reconcile voided OCE event, Epic final rank and exact Zoro duplicates
        run: node scripts/manual-review-20261107-final-audit.cjs
      - name: Validate records and data consistency
        run: npm run validate
      - name: Run approval and synced-candidate regression tests
        run: node --test tests/verified-history-approval.test.cjs tests/approval-history.test.cjs
      - name: Commit with safe rebase on main
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json auto-sync-review.json history-sync-status.json auto-sync-status.json history-sync-reviewed.json approval-history.json updates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'data: clear voided and duplicate review items without false awards'
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
