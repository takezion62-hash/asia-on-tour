name: One-off publish six S35 ME Round1 results
on:
  push:
    branches: [data/s35-me-partial-six-20261118]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check mature original Epic prefix, unique UUID pairs and rank without changes
        run: node scripts/publish-s35-me-six-20261118.cjs --dry-run
      - name: Publish six evidence-sealed S35 ME records and rebuild indices
        run: |
          node scripts/publish-s35-me-six-20261118.cjs --apply
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Full source, historical approval, and tamper regression checks
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/verified-s35-me-six-20261118.test.cjs
      - name: Commit approved data only to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add history-sync-review.json history-sync-status.json approval-history.json updates.json candidate-triage.json
          git diff --cached --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Ev '^(source-results/|season-data/|history-sync-review\.json$|history-sync-status\.json$|approval-history\.json$|updates\.json$|candidate-triage\.json$)' /tmp/changed.txt; then exit 1; fi
          test -s /tmp/changed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: materialize six S35 ME original Epic Round1 records [skip ci]"
          git push origin HEAD:data/s35-me-partial-six-20261118
