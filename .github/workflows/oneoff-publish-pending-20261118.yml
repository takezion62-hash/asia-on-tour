name: Materialize 64 source-verified attendance candidates
on:
  push:
    branches: [data/pending-bulk-review-20261118]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate 137 candidate source checkpoints (read only)
        run: node scripts/audit-all-pending-20261118.cjs
      - name: Publish all reviewed eligible candidates in two bounded batches
        env:
          AOT_BATCH_CONFIRMATION: CONFIRM
        run: |
          GITHUB_RUN_ID=bulk20261118first GITHUB_RUN_ATTEMPT=1 node scripts/review-batch.cjs --apply --limit=100
          GITHUB_RUN_ID=bulk20261118second GITHUB_RUN_ATTEMPT=1 node scripts/review-batch.cjs --apply --limit=100
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Validate source, approvals, duplicates and season index before committing
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
      - name: Persist only approved data and reports
        run: |
          set -euo pipefail
          git add -A source-results season-data review-reports
          git add auto-sync-review.json history-sync-review.json auto-sync-status.json history-sync-status.json history-sync-reviewed.json
          git add approval-history.json updates.json candidate-triage.json
          git diff --cached --name-only | tee /tmp/changed-files.txt
          if grep -Ev '^(source-results/|season-data/|review-reports/|auto-sync-review\.json$|history-sync-review\.json$|auto-sync-status\.json$|history-sync-status\.json$|history-sync-reviewed\.json$|approval-history\.json$|updates\.json$|candidate-triage\.json$)' /tmp/changed-files.txt; then
            echo "::error::Unplanned source mutation"
            exit 1
          fi
          test -s /tmp/changed-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 64 verified attendance-only reviews [skip ci]"
          git push origin HEAD:data/pending-bulk-review-20261118
