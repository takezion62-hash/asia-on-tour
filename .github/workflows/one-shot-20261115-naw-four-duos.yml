name: Temporary NAW 2025 four duo screenshot ingest
on:
  push:
    branches: [data/20261115-naw-s36-s39-four-duos]
    paths:
      - '.github/workflows/one-shot-20261115-naw-four-duos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-naw-four-duos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    name: 4成績の本人ID・賞金・重複を確認して登録
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 登録前の正本データ・マニフェスト整合性
        run: node scripts/source-results-store.cjs verify
      - name: ユーザー画像・既存pegu別名・Epic ID・重複・賞金のdry-run
        run: node scripts/one-shot-20261115-naw-four-duos.cjs --dry-run
      - name: 4件を追加して既存選手と新規選手を紐付け
        run: node scripts/one-shot-20261115-naw-four-duos.cjs
      - name: 公開用データとランキングを再生成
        run: |
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: 必須JSON・賞金・本人ID・大会日付・索引と関連単体テスト
        run: |
          node scripts/validate-data.cjs
          node scripts/validate-approvals.cjs
          node scripts/validate-updates.cjs
          node scripts/source-results-store.cjs verify
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/data-validation.test.cjs tests/approval-history.test.cjs tests/source-results-store.test.cjs tests/session-date-consistency.test.cjs tests/tournament-rules.test.cjs tests/final-round-consistency.test.cjs
      - name: 正本データと生成済み索引だけをブランチに反映
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add players.json candidate-triage.json
          git add -A source-results season-data
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo '::error::Nothing changed'
            exit 1
          fi
          git commit -m 'data: add NAW 2025 June Console and December Reload four duos'
          git push origin HEAD:data/20261115-naw-s36-s39-four-duos
