name: AOT publish verified historical review 2026-11-07
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-history-20261107.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  publish-verifiable-records:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate publication code syntax
        run: node --check scripts/manual-review-history-20261107-rule30.cjs
      - name: Reconcile 30 frozen review IDs with Epic leaderboard and official rules
        run: node scripts/manual-review-history-20261107-rule30.cjs
      - name: Validate published records and financial totals
        run: npm run validate
      - name: Run existing verified-result safety regressions
        run: node --test tests/verified-history-approval.test.cjs tests/approval-history.test.cjs
      - name: Commit confirmed records without discarding concurrent work
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json history-sync-reviewed.json history-sync-status.json updates.json
          if git diff --cached --quiet; then
            echo "No new safe records to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish verified historical qualifiers and Victory Cup finals"
          for attempt in 1 2 3; do
            git pull --rebase origin main || {
              git rebase --abort || true
              echo "::error::Concurrent data changed; not overwriting newer records"
              exit 1
            }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
