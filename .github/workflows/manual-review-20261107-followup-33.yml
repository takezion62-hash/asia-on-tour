name: AOT source-check and publish next 33 historical candidates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-20261107-followup-33.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check review script syntax
        run: node --check scripts/manual-review-20261107-followup-33.cjs
      - name: Compare saved exact Epic event identities, zero-awards and skin qualification
        run: node scripts/manual-review-20261107-followup-33.cjs
      - name: Validate individual cash totals, updates and source-safe result sets
        run: npm run validate
      - name: Regression tests - published history and official payouts
        run: node --test tests/osirion-sync.test.cjs tests/automatic-unreal-approval.test.cjs tests/verified-history-approval.test.cjs tests/approval-history.test.cjs
      - name: Commit reviewed records without overwriting concurrent syncs
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json history-sync-reviewed.json history-sync-status.json updates.json
          if git diff --cached --quiet; then
            echo 'No verified new records'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: add reviewed S30 S31 S37 FNCS and cosmetic historical results'
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
