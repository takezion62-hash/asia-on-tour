name: One-off S35 S37 38 source-backed duo approvals
on:
  push:
    branches: [data/pending-bulk-review-20261118]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify original 38 saved Epic candidate/payout proofs without data writes
        run: node scripts/publish-bulk-s35-s37-20261118.cjs --dry-run
      - name: Publish official S35 and S37 duo qualifications, finals and $200 cash
        run: |
          node scripts/publish-bulk-s35-s37-20261118.cjs
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Verify full published data, official rule source, ledger replay and all 38
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/tournament-rules.test.cjs tests/verified-bulk-s35-s37-20261118.test.cjs
      - name: Commit only canonical outputs to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add history-sync-review.json history-sync-status.json approval-history.json updates.json candidate-triage.json
          git diff --cached --name-only | tee /tmp/approved-files.txt
          if grep -Ev '^(source-results/|season-data/|history-sync-review\.json$|history-sync-status\.json$|approval-history\.json$|updates\.json$|candidate-triage\.json$)' /tmp/approved-files.txt; then
            echo "::error::Unexpected changed path" && exit 1
          fi
          test -s /tmp/approved-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 38 May-2025 S35 and S37 official duo score results [skip ci]"
          git push origin HEAD:data/pending-bulk-review-20261118
