name: One-time verified pending results publication Nov 10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-pending-20261110.yml'
      - 'scripts/review-candidates-20261110.cjs'
      - 'tests/participation-ui.test.cjs'
      - 'scripts/verify-s30-finals-20261110.cjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  source-audit-and-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Validate syntax and current leaderboard records
        run: |
          node --check scripts/review-candidates-20261110.cjs
          npm run validate
      - name: Audit and publish only source-verified, deduplicated records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/review-candidates-20261110.cjs --audit
            node scripts/review-candidates-20261110.cjs
            node scripts/verify-s30-finals-20261110.cjs
            npm run validate
            node --test tests/participation-sync.test.cjs tests/participation-ui.test.cjs tests/safe-sync-merge.test.cjs
            git add results.json updates.json auto-sync-review.json history-sync-review.json auto-sync-status.json history-sync-status.json history-sync-reviewed.json participation participation-index.json
            if git diff --cached --quiet; then
              echo "AOT_20261110_NO_SAFE_NEW_RESULTS"
              exit 0
            fi
            git commit -m "data: publish source-verified reviewed qualifiers and archive pending attendance"
            if git push origin HEAD:main; then
              echo "AOT_20261110_COMMITTED_AND_VALIDATED"
              exit 0
            fi
            sleep $((attempt*3))
          done
          echo "::error::Concurrent publication could not be safely merged"
          exit 1
