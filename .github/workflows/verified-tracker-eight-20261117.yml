name: Materialize Nov17 verified Tracker batch
on:
  push:
    branches: [data/verified-eight-tracker-20261117]
permissions:
  contents: write
  actions: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove exact image/identity/official-payout audit without writes
        run: node scripts/publish-tracker-eight-20261117.cjs --dry-run
      - name: Publish six results and audited two-row S41 correction in branch sandbox
        run: |
          node scripts/publish-tracker-eight-20261117.cjs
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Verify canonical manifest, full cash/approval/duplicate checks and targeted tests
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/verified-tracker-eight-20261117.test.cjs
      - name: Commit only fully verified generated artifacts back to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add players.json updates.json approval-history.json candidate-triage.json
          git add data/manual-approvals/20261117-s41-days-promotion-history.json
          git diff --cached --name-only | tee /tmp/aot-changed.txt
          if grep -Ev '^(source-results/|season-data/|players\.json$|updates\.json$|approval-history\.json$|candidate-triage\.json$|data/manual-approvals/20261117-s41-days-promotion-history\.json$)' /tmp/aot-changed.txt; then
            echo "::error::Unexpected modified file detected"
            exit 1
          fi
          test -s /tmp/aot-changed.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: materialize six verified finals and two S41 NAC cash corrections [skip ci]"
          git push origin HEAD:data/verified-eight-tracker-20261117
          gh workflow run tests.yml --ref data/verified-eight-tracker-20261117
