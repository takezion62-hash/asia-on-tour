name: AOT source-verified OCE Unreal Cup team cash
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-unreal-20261107-teamcash.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact award script syntax
        run: node --check scripts/manual-unreal-20261107-teamcash.cjs
      - name: Audit official cash tier and publish exact 172nd place team
        run: node scripts/manual-unreal-20261107-teamcash.cjs
      - name: Validate all results and preserve unverified personal share
        run: npm run validate
      - name: Test historical payout safety
        run: node --test tests/verified-history-approval.test.cjs tests/approval-history.test.cjs
      - name: Commit verified cash result without overwriting concurrent work
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json history-sync-reviewed.json history-sync-status.json updates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'data: record OCE Unreal Cup team cash without inferred per-player share'
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
