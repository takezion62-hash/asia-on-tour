name: Temporary verified 40-candidate batch publication
on:
  push:
    branches: [ops/batch-publish-40-20261113]
    paths:
      - .github/workflows/aot-40-batch-temp.yml
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated result proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Preview all pending candidates with saved original Epic checkpoints
        run: node scripts/review-batch.cjs --dry-run --limit=100
      - name: Generate inspected proposal with explicit current user authorization
        env:
          AOT_BATCH_CONFIRMATION: CONFIRM
        run: node scripts/review-batch.cjs --apply --limit=100
      - name: Rebuild browse indexes and validate unchanged cash total and awards
        run: |
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
      - name: Run focused review / duplicate / data integrity regressions
        run: |
          node --test \
            tests/review-batch.test.cjs \
            tests/manual-approval.test.cjs \
            tests/approval-history.test.cjs \
            tests/data-validation.test.cjs \
            tests/reviewed-publication-core.test.cjs \
            tests/source-results-store.test.cjs \
            tests/source-results-split.test.cjs \
            tests/candidate-triage.test.cjs \
            tests/tournament-rules.test.cjs \
            tests/session-date-consistency.test.cjs
      - name: Remove one-time trigger before proposing any published data
        run: |
          rm .github/workflows/aot-40-batch-temp.yml
          node --test tests/workflow-inventory.test.cjs
      - name: Commit only verified updates, audit report, and trigger removal
        run: |
          set -euo pipefail
          git add -A source-results season-data review-reports
          git add approval-history.json history-sync-reviewed.json history-sync-review.json auto-sync-review.json history-sync-status.json auto-sync-status.json candidate-triage.json updates.json
          git add -u .github/workflows/aot-40-batch-temp.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No safe changes to propose"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: approve evidence-backed batch without inferring prize values"
          git push origin HEAD:ops/batch-publish-40-20261113
