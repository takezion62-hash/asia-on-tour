name: AOT publish verified archived qualifying and participation results
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-review-20261107-round1-21.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Review script syntax check
        run: node --check scripts/manual-review-20261107-round1-21.cjs
      - name: Validate official round, team IDs, final standings and explicit zero-award rules
        run: node scripts/manual-review-20261107-round1-21.cjs
      - name: Verify site data, total individual prize arithmetic and update history
        run: npm run validate
      - name: Verify historical data regressions
        run: node --test tests/verified-history-approval.test.cjs tests/approval-history.test.cjs tests/tournament-rules.test.cjs
      - name: Commit reviewed results without replacing other writes
        run: |
          set -euo pipefail
          git add results.json history-sync-review.json history-sync-reviewed.json history-sync-status.json updates.json
          if git diff --cached --quiet; then
            echo "No safe records to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish historically checked Duo Cash, FNCS, Console, Performance scores"
          for attempt in 1 2 3; do
            git pull --rebase origin main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
