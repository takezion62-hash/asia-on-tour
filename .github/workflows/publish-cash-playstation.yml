name: AOT third verified candidate publication
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-cash-playstation.yml"
      - "scripts/publish-verified-remaining-pending.cjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-cash-playstation-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify ranked results and publish to newest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-verified-remaining-pending.cjs --dry-run
            node scripts/publish-verified-remaining-pending.cjs
            npm run validate
            node --test tests/manual-approval.test.cjs tests/approval-history.test.cjs tests/cosmetic-rank-rules.test.cjs tests/tournament-rules.test.cjs
            git add results.json history-sync-review.json auto-sync-review.json history-sync-status.json auto-sync-status.json approval-history.json updates.json history-sync-reviewed.json
            if git diff --cached --quiet; then
              echo "AOT_THIRD_PUBLISH no safely publishable candidates"
              exit 0
            fi
            git commit -m "data: publish verified historic cash and PlayStation results"
            if git push origin HEAD:main; then
              echo "AOT_THIRD_PUBLISH published"
              exit 0
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::Concurrent commit prevented safe result publication"
              exit 1
            fi
            sleep $((attempt * 2))
          done
