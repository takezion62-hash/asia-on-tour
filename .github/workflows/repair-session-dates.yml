name: AOT historical session date and duplicate repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-session-dates.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply strict JST and duplicate reconciliation
        run: node scripts/repair-historical-session-dates.cjs
      - name: Validate records and calendar
        run: |
          npm run validate
          node --test tests/historical-calendar.test.cjs tests/final-round-consistency.test.cjs
      - name: Commit verified changes
        run: |
          git add results.json updates.json history-sync-reviewed.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: correct 14 local-date offsets and deduplicate 4 finals"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || {
              git rebase --abort || true
              exit 1
            }
            git push origin HEAD:main && exit 0
            sleep $((attempt*4))
          done
          exit 1
