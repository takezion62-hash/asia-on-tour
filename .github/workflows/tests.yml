name: Data and site tests

on:
  push:
    # Docs-only pushes do not change public data or executable site behavior.
    paths-ignore:
      - '**/*.md'
      - 'review-requests/launch.json'
  pull_request:
  workflow_dispatch:
    inputs:
      review_base_sha:
        description: 'Trusted main SHA for generated reviewed-results PR (invalid/untrusted -> full suite)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: 変更範囲の安全判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 信頼済みbaseから変更範囲を判定（不明ならフルテスト）
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
          DISPATCH_BASE_SHA: ${{ inputs.review_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the trusted PR base or the previous main commit. A push on
          # a feature branch, a new branch, a force-created ref, or an
          # unknown event always runs the full suite.
          BASE_SHA=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" =~ ^refs/heads/reviewed-results/[0-9]+-[0-9]+$ ]]; then
            # Explicit workflow_dispatch from our trusted review publisher.
            # Never allow arbitrary branch/base SHA to define trusted code.
            BASE_SHA="$DISPATCH_BASE_SHA"
            if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] ||
                ! git merge-base --is-ancestor "$BASE_SHA" "$GITHUB_SHA" ||
                ! git merge-base --is-ancestor "$BASE_SHA" refs/remotes/origin/main; then
              BASE_SHA=""
            fi
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ||
                "$BASE_SHA" =~ ^0{40}$ ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=unknown-event-or-base" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BASE_SHA:scripts/ci-change-scope.cjs" 2>/dev/null; then
            # Never execute a change classifier from the PR/push itself.
            git show "$BASE_SHA:scripts/ci-change-scope.cjs" > "$RUNNER_TEMP/aot-trusted-change-scope.cjs"
            node "$RUNNER_TEMP/aot-trusted-change-scope.cjs"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=classifier-not-yet-on-base" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: [classify]
    if: needs.classify.result == 'success'
    name: JSON検証・単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: HTMLの公開JS/CSS参照を先に検証
        run: node --check scripts/serve.cjs && node scripts/site-assets.cjs
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: JSON構造・参照・現金賞金を検証
        run: npm run validate
      - name: Verify season shards agree with source manifest and legacy projection
        run: node scripts/build-source-results.cjs --check
      - name: Tracker実績の安全な事前反映テスト（書込なし）
        run: node scripts/apply-verified-tracker-finals.cjs --dry-run
      - name: S43 NAW Squads決勝3組の本人・賞金・重複検証（書込なし）
        run: node scripts/apply-verified-s43-squads-finals.cjs --dry-run
      - name: 2024/6/7 ME ZB Duos Cash Cup：10組の賞金・個人配分・承認履歴を照合（書込なし）
        run: node scripts/apply-s30-me-zb-duos-cash-20240607.cjs --dry-run
      - name: 2024/6/7 ME ZB Duos Cash Cup賞金圏外3組の本人・重複・賞金ゼロを照合（書込なし）
        run: node scripts/apply-s30-me-zb-duos-nonprize-20240607.cjs --dry-run
      - name: 2024/6/21 ME ZB Duos Cash Cup：13位賞金訂正・26/35位の賞金ゼロ・本人IDと重複検証
        run: node scripts/apply-s30-me-zb-duos-20240621.cjs --dry-run
      - name: 2024/5/6 ME ZB Duos Victory Cup：5組の本人IDと1VR=$100/人の賞金検証
        run: node scripts/apply-s29-me-zb-duos-20240506.cjs --dry-run
      - name: 2024/1/20・2/12 ME S28 ZB Duos Victory Cup：8組の本人ID・賞金・重複・シーズン登録を照合
        run: node scripts/apply-s28-me-zb-duos-20240120-20240212.cjs --dry-run
      - name: 2023/10/23・12/16 ME S26/S28 ZB Duos Victory Cup：10組の本人ID・賞金・重複を照合（書込なし）
        run: node scripts/apply-s26-s28-me-zb-duos-2023.cjs --dry-run
      - name: 2026/11/14 保留の現金賞金：Unger $100・Reoデュオ各$200を独立した証拠で照合
        run: node scripts/publish-nov14-pending-cash.cjs --dry-run
      - name: 2026/11/14 確認待ち49 ID：元の21件と新規32件の安全な再照合
        run: node scripts/publish-pending-review-20261114.cjs --dry-run
      - name: 2024/11/16 ME Solo決勝：公式Epic ID・独立した賞金根拠を照合（書込なし）
        run: node scripts/publish-verified-s32-me-vcup-20241116.cjs --dry-run
      - name: 2024 ME/NAC Solo VC残り11件：公式Epic ID・決勝出場・NAC突破条件・0VR報酬を照合
        run: node scripts/publish-verified-2024-me-nac-last11.cjs --dry-run
      - name: S42スキン大会の順位差9件・重複12件を公式Epic順位で安全照合（書込なし）
        run: node scripts/reconcile-s42-cosmetic-ranks-20261113.cjs --dry-run
      - name: 戦績データ更新は公開索引・確認待ち索引の正確な一致を確認
        if: needs.classify.outputs.mode == 'data'
        run: |
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
      - name: データ専用PRの厳格なユニット回帰テスト
        if: needs.classify.outputs.mode == 'data'
        run: |
          node --test \
            tests/data-validation.test.cjs \
            tests/session-date-consistency.test.cjs \
            tests/approval-history.test.cjs \
            tests/update-history.test.cjs \
            tests/tournament-rules.test.cjs \
            tests/final-round-consistency.test.cjs \
            tests/tournament-publication-unification.test.cjs \
            tests/rankings.test.cjs \
            tests/source-results-store.test.cjs \
            tests/source-results-split.test.cjs \
            tests/candidate-triage.test.cjs
      - name: コード・不明変更はすべての単体テストを実行
        if: needs.classify.outputs.mode == 'full'
        run: npm run test:unit
      - name: 失敗した単体テストファイルの記録を保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-failure-report
          path: test-results/unit-last-failed.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    needs: [classify]
    if: needs.classify.outputs.mode == 'full'
    name: PC・スマホ画面テスト (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Four independent runners; every Playwright test executes exactly once
      # across the four shards, including both PC and mobile projects.
      # Do not cancel other shards when one fails: retain failure evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: HTMLの公開JS/CSS参照を先に検証
        run: node --check scripts/serve.cjs && node scripts/site-assets.cjs
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: Chromiumを準備
        run: npx playwright install --with-deps chromium
      - name: PC・スマホの主要画面を検証（全件を4分割して並列実行）
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: 前回失敗したPC・スマホのテストIDを保存
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/.last-run.json ]]; then
            cp test-results/.last-run.json test-results/last-run.json
          fi
      - name: レポートと失敗時のスクリーンショット・トレースを保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: データ専用PRのPC・スマホ軽量表示確認
    needs: [classify]
    if: needs.classify.outputs.mode == 'data'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: サイトアセットとJSONの検査
        run: |
          node --check scripts/serve.cjs
          node scripts/site-assets.cjs
          npm ci --ignore-scripts
          npm run validate
      - name: 公開索引・確認待ち索引が元データと完全一致するか検査
        run: |
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
      - name: データ専用スモーク用Chromiumを準備
        run: npx playwright install --with-deps chromium
      - name: PC・スマホの最重要画面だけ検査
        run: npm run test:e2e -- tests/ci-data-smoke.spec.cjs
      - name: スモーク失敗の画面・トレースを保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-only-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: JSON検証・単体テスト・PCスマホ回帰テスト
    needs: [classify, unit, browser, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 判定範囲の必須成功条件を検証（不明やスキップを誤承認しない）
        env:
          SCOPE_RESULT: ${{ needs.classify.result }}
          MODE: ${{ needs.classify.outputs.mode }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: node scripts/ci-required-gate.cjs
