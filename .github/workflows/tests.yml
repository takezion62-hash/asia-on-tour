name: Data and site tests

on:
  push:
    # Docs-only pushes do not change public data or executable site behavior.
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: JSON検証・単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: JSON構造・参照・現金賞金を検証
        run: npm run validate
      - name: データと画面ロジックの回帰テスト
        run: npm run test:unit

  browser:
    name: PC・スマホ画面テスト (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Four independent runners; every Playwright test executes exactly once
      # across the four shards, including both PC and mobile projects.
      # Do not cancel other shards when one fails: retain failure evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: Chromiumを準備
        run: npx playwright install --with-deps chromium
      - name: PC・スマホの主要画面を検証（全件を4分割して並列実行）
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: レポートと失敗時のスクリーンショット・トレースを保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    # 既存の必須チェック名を維持。どちらかのジョブが失敗・スキップされた場合も成功にしない。
    name: JSON検証・単体テスト・PCスマホ回帰テスト
    needs: [unit, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: JSON・単体・PCスマホの全件成功を確認
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        shell: bash
        run: |
          echo "JSON/Unit: ${UNIT_RESULT}"
          echo "PC/Mobile E2E: ${BROWSER_RESULT}"
          if [[ "${UNIT_RESULT}" != "success" || "${BROWSER_RESULT}" != "success" ]]; then
            echo "::error::All validation, unit and browser jobs must succeed before merge."
            exit 1
          fi
          echo "All required checks passed."

  aot_reconcile_verified_2024:
    if: github.event_name == 'push' && github.ref == 'refs/heads/verified-me-2024-finals-20261111'
    name: Temporary merge-safe repair of 2024 ME PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: verified-me-2024-finals-20261111
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Merge latest main without losing parallel auto-sync results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for x in results players tournaments updates; do cp "$x.json" "/tmp/aot-ours-$x.json"; done
          git fetch origin main
          for x in results players tournaments updates; do git show "origin/main:$x.json" > "/tmp/aot-main-$x.json"; done
          git merge --no-commit --no-ff origin/main || true
          node scripts/temp-reconcile-2024-me.cjs
          git show origin/main:.github/workflows/tests.yml > .github/workflows/tests.yml
          git rm scripts/temp-reconcile-2024-me.cjs
          git add -A
          if [ -n "$(git ls-files -u)" ]; then echo "::error::Unresolved merge conflict"; git ls-files -u; exit 1; fi
          git diff --cached --stat
      - name: Validate merged JSON and run all unit tests
        run: |
          npm ci --ignore-scripts
          npm run validate
          npm run test:unit
      - name: Commit reconciled proposal and remove temporary changes
        run: |
          set -euo pipefail
          git commit -m "merge: preserve latest main results plus 7 verified 2024 ME finals"
          git push origin HEAD:verified-me-2024-finals-20261111
