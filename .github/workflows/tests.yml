name: Data and site tests

on:
  push:
    # Docs-only pushes do not change public data or executable site behavior.
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: JSON検証・単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: HTMLの公開JS/CSS参照を先に検証
        run: node --check scripts/serve.cjs && node scripts/site-assets.cjs
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: JSON構造・参照・現金賞金を検証
        run: npm run validate
      - name: Tracker実績の安全な事前反映テスト（書込なし）
        run: node scripts/apply-verified-tracker-finals.cjs --dry-run
      - name: データと画面ロジックの回帰テスト
        run: npm run test:unit

  browser:
    name: PC・スマホ画面テスト (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Four independent runners; every Playwright test executes exactly once
      # across the four shards, including both PC and mobile projects.
      # Do not cancel other shards when one fails: retain failure evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: HTMLの公開JS/CSS参照を先に検証
        run: node --check scripts/serve.cjs && node scripts/site-assets.cjs
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: Chromiumを準備
        run: npx playwright install --with-deps chromium
      - name: PC・スマホの主要画面を検証（全件を4分割して並列実行）
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: レポートと失敗時のスクリーンショット・トレースを保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    # 既存の必須チェック名を維持。どちらかのジョブが失敗・スキップされた場合も成功にしない。
    name: JSON検証・単体テスト・PCスマホ回帰テスト
    needs: [unit, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: JSON・単体・PCスマホの全件成功を確認
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        shell: bash
        run: |
          echo "JSON/Unit: ${UNIT_RESULT}"
          echo "PC/Mobile E2E: ${BROWSER_RESULT}"
          if [[ "${UNIT_RESULT}" != "success" || "${BROWSER_RESULT}" != "success" ]]; then
            echo "::error::All validation, unit and browser jobs must succeed before merge."
            exit 1
          fi
          echo "All required checks passed."
