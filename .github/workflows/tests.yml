name: Data and site tests

on:
  push:
    # Docs-only pushes do not change public data or executable site behavior.
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: 変更範囲の安全判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 信頼済みbaseから変更範囲を判定（不明ならフルテスト）
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ||
                ! "$PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ||
                ! "$PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=non-pr-or-invalid-revision" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${PR_BASE_SHA}:scripts/ci-change-scope.cjs" 2>/dev/null; then
            # Run the published BASE classifier, never a PR-proposed replacement.
            git show "${PR_BASE_SHA}:scripts/ci-change-scope.cjs" > "$RUNNER_TEMP/aot-trusted-change-scope.cjs"
            node "$RUNNER_TEMP/aot-trusted-change-scope.cjs"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=classifier-not-yet-on-base" >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: [classify]
    if: needs.classify.result == 'success'
    name: JSON検証・単体テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: HTMLの公開JS/CSS参照を先に検証
        run: node --check scripts/serve.cjs && node scripts/site-assets.cjs
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: JSON構造・参照・現金賞金を検証
        run: npm run validate
      - name: Tracker実績の安全な事前反映テスト（書込なし）
        run: node scripts/apply-verified-tracker-finals.cjs --dry-run
      - name: S43 NAW Squads決勝3組の本人・賞金・重複検証（書込なし）
        run: node scripts/apply-verified-s43-squads-finals.cjs --dry-run
      - name: データ専用PRは一時的にシーズン索引を再生成して検査
        if: needs.classify.outputs.mode == 'data'
        run: node scripts/build-season-data.cjs
      - name: データ専用PRの厳格なユニット回帰テスト
        if: needs.classify.outputs.mode == 'data'
        run: |
          node --test \
            tests/data-validation.test.cjs \
            tests/session-date-consistency.test.cjs \
            tests/approval-history.test.cjs \
            tests/update-history.test.cjs \
            tests/tournament-rules.test.cjs \
            tests/final-round-consistency.test.cjs \
            tests/tournament-publication-unification.test.cjs \
            tests/rankings.test.cjs
      - name: コード・不明変更はすべての単体テストを実行
        if: needs.classify.outputs.mode == 'full'
        run: npm run test:unit
      - name: 失敗した単体テストファイルの記録を保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-failure-report
          path: test-results/unit-last-failed.json
          if-no-files-found: ignore
          retention-days: 7

  browser:
    needs: [classify]
    if: needs.classify.outputs.mode == 'full'
    name: PC・スマホ画面テスト (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Four independent runners; every Playwright test executes exactly once
      # across the four shards, including both PC and mobile projects.
      # Do not cancel other shards when one fails: retain failure evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: HTMLの公開JS/CSS参照を先に検証
        run: node --check scripts/serve.cjs && node scripts/site-assets.cjs
      - name: 最小のテスト依存を導入
        run: npm ci --ignore-scripts
      - name: Chromiumを準備
        run: npx playwright install --with-deps chromium
      - name: PC・スマホの主要画面を検証（全件を4分割して並列実行）
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - name: 前回失敗したPC・スマホのテストIDを保存
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/.last-run.json ]]; then
            cp test-results/.last-run.json test-results/last-run.json
          fi
      - name: レポートと失敗時のスクリーンショット・トレースを保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-test-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: データ専用PRのPC・スマホ軽量表示確認
    needs: [classify]
    if: needs.classify.outputs.mode == 'data'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: サイトアセットとJSONの検査
        run: |
          node --check scripts/serve.cjs
          node scripts/site-assets.cjs
          npm ci --ignore-scripts
          npm run validate
      - name: 最新JSONから一時的なシーズンデータを作成
        run: node scripts/build-season-data.cjs
      - name: PC・スマホの最重要画面だけ検査
        run: npm run test:e2e -- tests/ci-data-smoke.spec.cjs
      - name: スモーク失敗の画面・トレースを保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-only-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: JSON検証・単体テスト・PCスマホ回帰テスト
    needs: [classify, unit, browser, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 判定範囲の必須成功条件を検証（不明やスキップを誤承認しない）
        env:
          SCOPE_RESULT: ${{ needs.classify.result }}
          MODE: ${{ needs.classify.outputs.mode }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: node scripts/ci-required-gate.cjs
