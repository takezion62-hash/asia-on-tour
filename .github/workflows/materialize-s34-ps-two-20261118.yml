name: Materialize last 2 source-verified S34 finalists as unknown-cash attendance
on:
  push:
    branches: [data/publish-s34-playstation-two-20261118]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preflight the exact two original Epic UUIDs and duplicate-free candidates
        run: node scripts/publish-s34-ps-two-20261118.cjs --dry-run
      - name: Publish attendance only and rebuild source seasons and review index
        run: |
          node scripts/publish-s34-ps-two-20261118.cjs
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Validate all public rows, award totals, and immutable S34 evidence
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/verified-s34-ps-final-two-20261118.test.cjs
      - name: Commit only evidence-verified two attendance rows and derived indices
        shell: bash
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add history-sync-review.json history-sync-reviewed.json history-sync-status.json
          git add approval-history.json updates.json candidate-triage.json
          git diff --cached --name-only | tee /tmp/new-files.txt
          if grep -Ev '^(source-results/|season-data/|history-sync-review\.json$|history-sync-reviewed\.json$|history-sync-status\.json$|approval-history\.json$|updates\.json$|candidate-triage\.json$)' /tmp/new-files.txt; then
            echo "::error::Unexpected file touched"
            exit 1
          fi
          test -s /tmp/new-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish two original Epic UUID confirmed S34 finalists as unconfirmed-cash attendance [skip ci]"
          git push origin HEAD:data/publish-s34-playstation-two-20261118
