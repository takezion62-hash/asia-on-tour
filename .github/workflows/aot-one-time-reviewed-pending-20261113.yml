name: Temporary verified candidate publication, self-cleaning
on:
  push:
    branches:
      - feat/review-pending-20261113
    paths:
      - .github/workflows/aot-one-time-reviewed-pending-20261113.yml
      - scripts/publish-verified-pending-20261113.cjs
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Strict dry-run of every queued candidate
        run: node scripts/publish-verified-pending-20261113.cjs --dry-run
      - name: Publish only evidence-verified candidates to season shards
        run: node scripts/publish-verified-pending-20261113.cjs
      - name: Rebuild browse data and candidate triage
        run: |
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
          node scripts/build-source-results.cjs --check
          npm run validate
      - name: Remove temporary workflow then test approved workflow inventory
        run: |
          rm -f .github/workflows/aot-one-time-reviewed-pending-20261113.yml scripts/publish-verified-pending-20261113.cjs
          node --test tests/workflow-inventory.test.cjs
      - name: Commit data only and remove temporary automation
        run: |
          set -euo pipefail
          rm -f .github/workflows/aot-one-time-reviewed-pending-20261113.yml
          rm -f scripts/publish-verified-pending-20261113.cjs
          git add -A source-results season-data
          git add updates.json approval-history.json auto-sync-review.json history-sync-review.json auto-sync-status.json history-sync-status.json candidate-triage.json
          git add -u .github/workflows/aot-one-time-reviewed-pending-20261113.yml scripts/publish-verified-pending-20261113.cjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish only verified queue results to authoritative season shards"
          git push origin "HEAD:feat/review-pending-20261113"
