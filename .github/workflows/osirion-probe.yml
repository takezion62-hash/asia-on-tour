name: AOT Osirion API compatibility check
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osirion-probe.yml'
      - 'scripts/osirion-probe.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  osirion-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test documented public Osirion endpoints (read-only)
        run: node scripts/osirion-probe.cjs
