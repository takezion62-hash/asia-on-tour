name: AOT manual verified attendance publication
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-history-approval.yml"
      - "data/manual-approvals/20261106-participation.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aot-provider-history-main
  cancel-in-progress: false
jobs:
  publish-reviewed-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Approve exact eight attendance candidates with strict guards
        run: node scripts/apply-reviewed-participation.cjs
      - name: Validate all site data
        run: npm run validate
      - name: Commit without overwriting other edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json history-sync-review.json history-sync-status.json updates.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish 8 manually checked historical attendance results"
          for attempt in 1 2 3; do
            git pull --rebase origin main || {
              git rebase --abort || true
              exit 1
            }
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
