name: Rebuild lightweight season data
on:
  push:
    branches: [main]
    paths:
      - results.json
      - tournaments.json
      - players.json
      - achievements.js
      - rankings.js
      - scripts/build-season-data.cjs
      - scripts/build-candidate-triage.cjs
      - scripts/candidate-triage-core.cjs
      - .github/workflows/build-season-data.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: season-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    name: 戦績分割・サマリー再生成
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 正本データからシーズン分割と候補確認の軽量索引を再生成
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Do not overwrite a new provider result or manually reviewed publication.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            node scripts/build-season-data.cjs --check
            node scripts/build-candidate-triage.cjs --check
            git add -A season-data
            git add candidate-triage.json
            if git diff --cached --quiet; then
              echo "Season and candidate triage indexes are current"
              exit 0
            fi
            git commit -m "chore(data): refresh lightweight season and review indexes [skip ci]"
            if git push origin HEAD:main; then
              echo "Published generated indexes without altering results"
              exit 0
            fi
            echo "main moved while updating indexes; retrying from newest source"
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish generated indexes after retries"
          exit 1
