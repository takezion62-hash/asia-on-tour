concurrency:
  group: season-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    name: 閲覧用・更新元のシーズン分割を検証・再生成
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 正本データからシーズン分割と候補確認の軽量索引を再生成
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Do not overwrite a new provider result or manually reviewed publication.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/source-results-store.cjs verify
