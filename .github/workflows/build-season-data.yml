name: Rebuild lightweight season data
on:
  push:
    branches: [main]
    paths:
      - tournaments.json
      - players.json
      - achievements.js
      - rankings.js
      - scripts/build-season-data.cjs
      - scripts/build-source-results.cjs
      - scripts/source-results-store.cjs
      - 'source-results/**'
      - scripts/apply-verified-tracker-finals.cjs
      - scripts/apply-verified-s43-squads-finals.cjs
      - scripts/apply-s30-me-zb-duos-cash-20240607.cjs
      - scripts/apply-s30-me-zb-duos-nonprize-20240607.cjs
      - scripts/apply-s30-me-zb-duos-20240621.cjs
      - scripts/apply-s29-me-zb-duos-20240506.cjs
      - scripts/apply-s28-me-zb-duos-20240120-20240212.cjs
      - scripts/apply-s26-s28-me-zb-duos-2023.cjs
      - scripts/apply-s25-me-zb-duos-2023.cjs
      - scripts/apply-ps-cups-2022-2024-nov14.cjs
      - scripts/apply-s37-s39-s40-awards7.cjs
      - scripts/verified-s37-s39-s40-awards7.cjs
      - data/manual-approvals/20261114-s37-s39-s40-awards7-proof.json
      - scripts/verified-ps-cups-2022-2024-nov14.cjs
      - data/manual-approvals/20261114-s22-s25-s31-ps-zb-10-proof.json
      - scripts/verified-s25-me-zb-duos-2023.cjs
      - data/manual-approvals/20230619-26-me-zb-duos-vcup-proof.json
      - scripts/publish-pending-review-20261114.cjs
      - scripts/publish-nov14-pending-cash.cjs
      - scripts/reconcile-pending-hamikuma-20261114.cjs
      - scripts/verified-nov14-pending-cash.cjs
      - scripts/verified-history-approval.cjs
      - tournament-rules.json
      - scripts/verified-s26-s28-me-zb-duos-2023.cjs
      - data/manual-approvals/20231023-20231216-me-zb-duos-vcup-proof.json
      - scripts/verified-s28-me-zb-duos-20240120-20240212.cjs
      - data/manual-approvals/20240120-20240212-me-zb-duos-vcup-proof.json
      - scripts/verified-s29-me-zb-duos-20240506.cjs
      - data/manual-approvals/20240506-me-zb-duos-vcup-proof.json
      - scripts/verified-s30-me-zb-duos-20240621.cjs
      - data/manual-approvals/20240621-me-zb-duos-final-proof.json
      - scripts/publish-verified-s32-me-vcup-20241116.cjs
      - scripts/publish-verified-2024-me-nac-last11.cjs
      - scripts/reconcile-s42-cosmetic-ranks-20261113.cjs
      - scripts/verified-s30-duos-nonprize-20240607.cjs
      - data/manual-approvals/20240607-me-zb-duos-zero-finals.json
      - scripts/verified-s30-duos-cash-20240607.cjs
      - scripts/validate-approvals.cjs
      - 'data/manual-approvals/*-cash-evidence.json'
      - 'data/manual-approvals/*-tracker.json'
      - 'data/manual-approvals/*-squads-confirmed.json'
      - scripts/build-candidate-triage.cjs
      - scripts/candidate-triage-core.cjs
      - .github/workflows/build-season-data.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: season-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    name: 閲覧用・更新元のシーズン分割を検証・再生成
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 正本データからシーズン分割と候補確認の軽量索引を再生成
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Do not overwrite a new provider result or manually reviewed publication.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/source-results-store.cjs verify
            node scripts/apply-verified-tracker-finals.cjs --dry-run
            node scripts/apply-verified-tracker-finals.cjs
            node scripts/apply-verified-s43-squads-finals.cjs --dry-run
            node scripts/apply-verified-s43-squads-finals.cjs
            node scripts/apply-s30-me-zb-duos-cash-20240607.cjs --dry-run
            node scripts/apply-s30-me-zb-duos-cash-20240607.cjs
            node scripts/apply-s30-me-zb-duos-nonprize-20240607.cjs --dry-run
            node scripts/apply-s30-me-zb-duos-nonprize-20240607.cjs
            node scripts/apply-s30-me-zb-duos-20240621.cjs --dry-run
            node scripts/apply-s30-me-zb-duos-20240621.cjs
            node scripts/apply-s29-me-zb-duos-20240506.cjs --dry-run
            node scripts/apply-s29-me-zb-duos-20240506.cjs
            node scripts/apply-s28-me-zb-duos-20240120-20240212.cjs --dry-run
            node scripts/apply-s28-me-zb-duos-20240120-20240212.cjs
            node scripts/apply-s26-s28-me-zb-duos-2023.cjs --dry-run
            node scripts/apply-s26-s28-me-zb-duos-2023.cjs
            node scripts/apply-s25-me-zb-duos-2023.cjs --dry-run
            node scripts/apply-s25-me-zb-duos-2023.cjs
            node scripts/apply-ps-cups-2022-2024-nov14.cjs --dry-run
            node scripts/apply-ps-cups-2022-2024-nov14.cjs
            node scripts/apply-s37-s39-s40-awards7.cjs --dry-run
            node scripts/apply-s37-s39-s40-awards7.cjs
            node scripts/publish-nov14-pending-cash.cjs --dry-run
            node scripts/publish-nov14-pending-cash.cjs
            node scripts/reconcile-pending-hamikuma-20261114.cjs --dry-run
            node scripts/reconcile-pending-hamikuma-20261114.cjs
            node scripts/publish-pending-review-20261114.cjs --dry-run
            node scripts/publish-pending-review-20261114.cjs
            node scripts/publish-verified-s32-me-vcup-20241116.cjs --dry-run
            node scripts/publish-verified-s32-me-vcup-20241116.cjs
            node scripts/publish-verified-2024-me-nac-last11.cjs --dry-run
            node scripts/publish-verified-2024-me-nac-last11.cjs --apply
            node scripts/reconcile-s42-cosmetic-ranks-20261113.cjs --dry-run
            node scripts/reconcile-s42-cosmetic-ranks-20261113.cjs --apply
            node scripts/validate-data.cjs
            node scripts/validate-approvals.cjs
            node scripts/validate-updates.cjs
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            node scripts/source-results-store.cjs verify
            node scripts/build-source-results.cjs --check
            node scripts/build-season-data.cjs --check
            node scripts/build-candidate-triage.cjs --check
            git add players.json updates.json approval-history.json
            git add history-sync-review.json history-sync-status.json history-sync-reviewed.json
            git add auto-sync-review.json auto-sync-status.json
            git add -A season-data
            git add -A source-results
            git add -A review-reports
            git add -A review-reports
            git add candidate-triage.json
            if git diff --cached --quiet; then
              echo "Season and candidate triage indexes are current"
              exit 0
            fi
            git commit -m "chore(data): publish verified Tracker finals and refresh season indexes [skip ci]"
            if git push origin HEAD:main; then
              echo "Published generated indexes without altering results"
              exit 0
            fi
            echo "main moved while updating indexes; retrying from newest source"
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish generated indexes after retries"
          exit 1
