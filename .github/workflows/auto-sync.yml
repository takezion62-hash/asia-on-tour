name: AOT safe results auto-sync
on:
  push:
    branches: [main]
    paths:
      - "scripts/osirion-sync.cjs"
      - "scripts/auto-sync-core.cjs"
      - "scripts/automatic-cosmetic-approval.cjs"
      - "scripts/automatic-cash-approval.cjs"
      - "scripts/automatic-unreal-approval.cjs"
      - "tests/automatic-unreal-approval.test.cjs"
      - "scripts/automatic-performance-approval.cjs"
      - "tests/automatic-performance-approval.test.cjs"
      - "tests/automatic-cash-approval.test.cjs"
      - "tournament-rules.json"
      - "scripts/validate-tournament-rules.cjs"
      - "tests/tournament-rules.test.cjs"
      - "scripts/cosmetic-rank-rules.cjs"
      - "tests/non-victory-auto-sync.test.cjs"
      - "tests/automatic-cosmetic-approval.test.cjs"
      - "auto-sync-config.json"
      - ".github/workflows/auto-sync.yml"
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize recent and historical writers of results.json/updates.json.
  # Never let simultaneous push-triggered scans race on a JSON rebase.
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check eligible tournament results
        env:
          AOT_FORTNITE_API_KEY: ${{ secrets.AOT_FORTNITE_API_KEY }}
        run: node scripts/osirion-sync.cjs
      - name: Validate data and run sync unit tests
        run: |
          npm run validate
          node --test tests/auto-sync.test.cjs tests/osirion-sync.test.cjs tests/non-victory-auto-sync.test.cjs tests/automatic-cosmetic-approval.test.cjs tests/cosmetic-rank-rules.test.cjs tests/automatic-cash-approval.test.cjs tests/automatic-unreal-approval.test.cjs tests/automatic-performance-approval.test.cjs tests/tournament-rules.test.cjs
      - name: Commit checked updates only
        run: |
          if [ -z "$(git status --porcelain -- results.json updates.json auto-sync-status.json auto-sync-review.json auto-sync-scan.json)" ]; then
            echo "No changes: disabled or already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json updates.json auto-sync-status.json auto-sync-review.json auto-sync-scan.json
          git commit -m "data: apply verified AOT tournament sync"
          # Race-safe, bounded retry: integrate other bots' commits, never force push.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || {
              git rebase --abort || true
              echo "Rebase conflict: preserve both histories and require review"
              exit 1
            }
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote advanced between pull and push; retrying ($attempt/5)"
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 safe retries"
          exit 1
