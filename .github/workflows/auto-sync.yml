name: AOT safe results auto-sync
on:
  push:
    branches: [main]
    paths:
      - "scripts/osirion-sync.cjs"
      - "scripts/safe-sync-merge.cjs"
      - "tests/safe-sync-merge.test.cjs"
      - "scripts/auto-sync-core.cjs"
      - "scripts/automatic-cosmetic-approval.cjs"
      - "scripts/automatic-cash-approval.cjs"
      - "scripts/automatic-unreal-approval.cjs"
      - "tests/automatic-unreal-approval.test.cjs"
      - "scripts/automatic-performance-approval.cjs"
      - "tests/automatic-performance-approval.test.cjs"
      - "tests/automatic-cash-approval.test.cjs"
      - "tournament-rules.json"
      - "scripts/validate-tournament-rules.cjs"
      - "tests/tournament-rules.test.cjs"
      - "scripts/cosmetic-rank-rules.cjs"
      - "tests/non-victory-auto-sync.test.cjs"
      - "tests/automatic-cosmetic-approval.test.cjs"
      - "auto-sync-config.json"
      - ".github/workflows/auto-sync.yml"
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize recent and historical writers of results.json/updates.json.
  # Never let simultaneous push-triggered scans race on a JSON rebase.
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Snapshot pre-scan public data for race-safe reconciliation
        run: node scripts/safe-sync-merge.cjs snapshot auto "$RUNNER_TEMP/aot-auto-base.json"
      - name: Check eligible tournament results
        env:
          AOT_FORTNITE_API_KEY: ${{ secrets.AOT_FORTNITE_API_KEY }}
        run: node scripts/osirion-sync.cjs
      - name: Validate data and run sync unit tests
        run: |
          npm run validate
          node --test tests/auto-sync.test.cjs tests/osirion-sync.test.cjs tests/non-victory-auto-sync.test.cjs tests/automatic-cosmetic-approval.test.cjs tests/cosmetic-rank-rules.test.cjs tests/automatic-cash-approval.test.cjs tests/automatic-unreal-approval.test.cjs tests/automatic-performance-approval.test.cjs tests/tournament-rules.test.cjs
      - name: Preserve verified recent scan output
        run: node scripts/safe-sync-merge.cjs snapshot auto "$RUNNER_TEMP/aot-auto-scanned.json"
      - name: Reconcile and commit onto newest main (conflict-safe)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Races with historical/backfill/manual changes are resolved by
          # replaying this scan's verified additions onto the freshest main.
          for attempt in 1 2 3 4 5; do
            echo "SAFE_RECENT_MERGE attempt ${attempt}/5"
            git fetch origin main
            git reset --hard origin/main
            node scripts/safe-sync-merge.cjs merge auto "$RUNNER_TEMP/aot-auto-base.json" "$RUNNER_TEMP/aot-auto-scanned.json"
            npm run validate
            node --test tests/safe-sync-merge.test.cjs
            git add results.json updates.json auto-sync-status.json auto-sync-review.json auto-sync-scan.json
            if git diff --cached --quiet; then
              echo "SAFE_RECENT_MERGE no new data to publish"
              exit 0
            fi
            git commit -m "data: safely merge recent AOT sync into newest main"
            if git push origin HEAD:main; then
              echo "SAFE_RECENT_MERGE published with existing history preserved"
              exit 0
            fi
            echo "Main moved during recent sync; replay changes onto newest main"
            sleep $((attempt * 3))
          done
          echo "SAFE_RECENT_MERGE failed after 5 conflict-safe attempts"
          exit 1
