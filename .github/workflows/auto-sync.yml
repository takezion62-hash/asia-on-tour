name: AOT safe results auto-sync
on:
  # Test-only changes are verified by tests.yml; they must not re-scan the provider.
  push:
    branches: [main]
    paths:
      - "scripts/osirion-sync.cjs"
      - "scripts/automatic-duo-qualifier-approval.cjs"
      - "scripts/verified-partial-page.cjs"
      - "scripts/scan-coverage.cjs"
      - "scripts/safe-sync-merge.cjs"
      - "scripts/auto-sync-core.cjs"
      - "scripts/automatic-cosmetic-approval.cjs"
      - "scripts/automatic-cash-approval.cjs"
      - "scripts/automatic-unreal-approval.cjs"
      - "scripts/automatic-performance-approval.cjs"
      - "tournament-rules.json"
      - "scripts/validate-tournament-rules.cjs"
      - "scripts/cosmetic-rank-rules.cjs"
      - "auto-sync-config.json"
      - ".github/workflows/auto-sync.yml"
  schedule:
    - cron: '17 0,4,8,12,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize recent and historical writers of results.json/updates.json.
  # Never let simultaneous push-triggered scans race on a JSON rebase.
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Snapshot pre-scan public data for race-safe reconciliation
        run: node scripts/safe-sync-merge.cjs snapshot auto "$RUNNER_TEMP/aot-auto-base.json"
      - name: Check eligible tournament results
        env:
          AOT_FORTNITE_API_KEY: ${{ secrets.AOT_FORTNITE_API_KEY }}
        run: node scripts/osirion-sync.cjs
      - name: Validate data and run sync unit tests
        run: |
          npm run validate
          node --test tests/auto-sync.test.cjs tests/osirion-sync.test.cjs tests/verified-partial-page.test.cjs tests/non-victory-auto-sync.test.cjs tests/automatic-cosmetic-approval.test.cjs tests/cosmetic-rank-rules.test.cjs tests/automatic-cash-approval.test.cjs tests/automatic-unreal-approval.test.cjs tests/automatic-performance-approval.test.cjs tests/tournament-rules.test.cjs
      - name: Preserve verified recent scan output
        run: node scripts/safe-sync-merge.cjs snapshot auto "$RUNNER_TEMP/aot-auto-scanned.json"
      - name: Reconcile and commit onto newest main (conflict-safe)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Races with historical/backfill/manual changes are resolved by
          # replaying this scan's verified additions onto the freshest main.
          fresh_source_retries=0
          for attempt in 1 2 3 4 5 6; do
            echo "SAFE_RECENT_MERGE attempt ${attempt}/6 (fresh-source rescans: ${fresh_source_retries})"
            git fetch origin main
            git reset --hard origin/main
            # Reject stale identity or prize rules before replaying provider results.
            # A changed input is NOT a merge conflict: re-run the provider scan
            # using the new main rather than loosening the source-hash guard.
            if node scripts/safe-sync-merge.cjs check-sources auto "$RUNNER_TEMP/aot-auto-base.json"; then
              :
            else
              check_code=$?
              if [ "$check_code" -ne 10 ]; then
                echo "::error::Source validation itself failed (${check_code})"
                exit "$check_code"
              fi
              if [ "$fresh_source_retries" -ge 1 ]; then
                echo "::error::Approval inputs changed again during the fresh scan; refusing unsafe publication"
                exit 1
              fi
              fresh_source_retries=$((fresh_source_retries + 1))
              echo "::notice::Player identity or rules changed during scan; discard stale output and re-scan from newest main"
              node scripts/safe-sync-merge.cjs snapshot auto "$RUNNER_TEMP/aot-auto-base.json"
              node scripts/osirion-sync.cjs
              npm run validate
              node --test tests/safe-sync-merge.test.cjs tests/auto-sync.test.cjs tests/verified-partial-page.test.cjs
              node scripts/safe-sync-merge.cjs snapshot auto "$RUNNER_TEMP/aot-auto-scanned.json"
              continue
            fi
            node scripts/safe-sync-merge.cjs merge auto "$RUNNER_TEMP/aot-auto-base.json" "$RUNNER_TEMP/aot-auto-scanned.json"
            npm run validate
            node --test tests/safe-sync-merge.test.cjs
            # Publish season shards together with the canonical results (bot pushes do not trigger push workflows).
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A season-data
            git add candidate-triage.json
            git add results.json updates.json auto-sync-status.json auto-sync-review.json auto-sync-scan.json
            if git diff --cached --quiet; then
              echo "SAFE_RECENT_MERGE no new data to publish"
              exit 0
            fi
            git commit -m "data: safely merge recent AOT sync into newest main"
            if git push origin HEAD:main; then
              echo "SAFE_RECENT_MERGE published with existing history preserved"
              exit 0
            fi
            echo "Main moved during recent sync; replay changes onto newest main"
            sleep $((attempt * 3))
          done
          echo "SAFE_RECENT_MERGE failed after 5 conflict-safe attempts"
          exit 1
