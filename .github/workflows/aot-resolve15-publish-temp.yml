name: Temporary strict resolve remaining 15, self-cleaning
on:
  push:
    branches:
      - feat/resolve-remaining-15-20261113
    paths:
      - .github/workflows/aot-resolve15-publish-temp.yml
      - scripts/resolve15-publish-temp.cjs
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Show exact evidence eligibility for the last 15
        run: node scripts/resolve15-publish-temp.cjs --dry-run
      - name: Publish verified source rows and resolve duplicates
        run: node scripts/resolve15-publish-temp.cjs
      - name: Rebuild manifests and validate unchanged older data
        run: |
          node scripts/source-results-store.cjs verify
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
          node scripts/build-source-results.cjs --check
          npm run validate
      - name: Remove all temporary automations before inventory test
        run: |
          rm .github/workflows/aot-resolve15-temp.yml scripts/resolve15-diagnostic-temp.cjs
          rm .github/workflows/aot-resolve15-publish-temp.yml scripts/resolve15-publish-temp.cjs
          node --test tests/workflow-inventory.test.cjs tests/data-validation.test.cjs tests/approval-history.test.cjs tests/update-history.test.cjs tests/final-round-consistency.test.cjs
      - name: Commit data and documented evidence (no one-off workflow remains)
        run: |
          set -euo pipefail
          git add -A source-results season-data review-reports
          git add history-sync-review.json history-sync-reviewed.json history-sync-status.json approval-history.json updates.json candidate-triage.json
          git add -u scripts/resolve15-diagnostic-temp.cjs scripts/resolve15-publish-temp.cjs .github/workflows/aot-resolve15-temp.yml .github/workflows/aot-resolve15-publish-temp.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: resolve remaining historical review evidence and reconcile duplicate skin results"
          git push origin HEAD:feat/resolve-remaining-15-20261113
