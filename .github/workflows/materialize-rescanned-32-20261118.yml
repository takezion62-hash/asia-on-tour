name: Materialize 32 rechecked original Epic account Round1 results
on:
  push:
    branches: [data/rescan-pending-verified-32-20261118]
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fail-closed dry-run: every immutable original Epic UUID and page proof
        run: node scripts/publish-rescanned-32-20261118.cjs --dry-run
      - name: Materialize only verified 32 and rebuild indexes
        run: |
          node scripts/publish-rescanned-32-20261118.cjs
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
      - name: Validate complete data and the 32 protected score/award regression tests
        run: |
          npm run validate
          node scripts/build-source-results.cjs --check
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
          node --test tests/verified-rescanned-32-20261118.test.cjs
      - name: Commit only result/review/ledger/index files, never unverified candidates
        shell: bash
        run: |
          set -euo pipefail
          git add -A source-results season-data
          git add history-sync-review.json history-sync-reviewed.json history-sync-status.json
          git add approval-history.json updates.json candidate-triage.json
          git diff --cached --name-only | tee /tmp/new-files.txt
          if grep -Ev '^(source-results/|season-data/|history-sync-review\.json$|history-sync-reviewed\.json$|history-sync-status\.json$|approval-history\.json$|updates\.json$|candidate-triage\.json$)' /tmp/new-files.txt; then
            echo "::error::Unexpected modified file"
            exit 1
          fi
          test -s /tmp/new-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish 32 original Epic account verified historical Round1 records [skip ci]"
          git push origin HEAD:data/rescan-pending-verified-32-20261118
