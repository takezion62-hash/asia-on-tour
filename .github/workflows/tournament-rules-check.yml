name: Tournament rules focused checks

on:
  # Full push/PR coverage is owned by tests.yml; this focused check is on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    name: Official rules registry and mobile display
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate rulebook shape, source links and cash table
        run: |
          node --check source-rules.js
          npm run validate
          node --test tests/tournament-rules.test.cjs tests/cosmetic-rank-rules.test.cjs tests/verified-history-approval.test.cjs tests/automatic-cash-approval.test.cjs tests/automatic-performance-approval.test.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: PC and mobile rulebook tests
        run: npx playwright test tests/source-rules.spec.cjs
