name: Promote verified attendance into official results
on:
  # Rule diffs and promotion-code changes can re-evaluate saved evidence.
  push:
    branches: [main]
    paths:
      - 'tournament-rules.json'
      - 'scripts/participation-promotion.cjs'
      - 'tests/participation-promotion.test.cjs'
      - '.github/workflows/participation-promotion.yml'
  # Later provider scans can complete an old official leaderboard. Keep
  # unmodified candidates cheap with per-candidate evidence fingerprints.
  schedule:
    - cron: '19 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  # Serialize alongside the existing results auto-writers.
  group: aot-provider-results-main
  cancel-in-progress: false
jobs:
  promote:
    name: Recheck only changed, rule-backed attendance (up to five)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-evaluate saved official leaderboard evidence and safely publish
        shell: bash
        env:
          AOT_PROMOTION_BATCH_SIZE: 5
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Every retry must start from the newest canonical main: never force
          # push or rebase generated JSON; stale results may have changed.
          for attempt in 1 2 3 4 5; do
            echo "PROMOTION_ATTEMPT $attempt/5"
            git fetch origin main
            git reset --hard origin/main
            node scripts/source-results-store.cjs verify
            node scripts/participation-promotion.cjs --dry-run
            node scripts/participation-promotion.cjs
            npm run validate
            node --test tests/participation-promotion.test.cjs tests/automatic-cash-approval.test.cjs tests/source-results-store.test.cjs
            # The builder computes from canonical rows but writes only changed
            # season shards, rankings and the compact all-season manifest.
            node scripts/build-season-data.cjs
            node scripts/build-candidate-triage.cjs
            git add -A -- source-results/ season-data/
            git add -- candidate-triage.json
            if [ -f participation-promotion-state.json ]; then
              git add -- participation-promotion-state.json
            fi
            if [ -f participation-promotion-history.json ]; then
              git add -- participation-promotion-history.json
            fi
            if git diff --cached --quiet; then
              echo 'PROMOTION_NO_CHANGES official rule or cached proof unchanged'
              exit 0
            fi
            git commit -m 'data: promote only reverified attendance, preserve IDs and audit proof'
            if git push origin HEAD:main; then
              echo 'PROMOTION_PUBLISHED safe in-place promotions committed to main'
              exit 0
            fi
            echo 'PROMOTION_RETRY main moved; reverify from canonical source again'
            sleep $((attempt * 3))
          done
          echo '::error::PROMOTION publication failed after five safe attempts'
          exit 1
