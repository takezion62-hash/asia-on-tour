name: Temporary strict AOT37 publication
on:
  push:
    branches: [feat/publish-reviewed-37-fast-20261113]
    paths:
      - scripts/aot-publish-37-temp.cjs
      - .github/workflows/aot-publish-37-temp.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check exact scores and official rule evidence without changes
        run: node scripts/aot-publish-37-temp.cjs --dry-run
      - name: Publish verified rows and reconcile confirmed duplicate
        run: node scripts/aot-publish-37-temp.cjs
      - name: Build immutable season read models and validate cash and approvals
        run: |
          node scripts/build-season-data.cjs
          node scripts/build-candidate-triage.cjs
          node scripts/build-source-results.cjs --check
          npm run validate
          node scripts/build-season-data.cjs --check
          node scripts/build-candidate-triage.cjs --check
      - name: Run important duplicate, rules and source-store regression tests
        run: |
          node --test \
            tests/data-validation.test.cjs \
            tests/approval-history.test.cjs \
            tests/session-date-consistency.test.cjs \
            tests/update-history.test.cjs \
            tests/tournament-rules.test.cjs \
            tests/final-round-consistency.test.cjs \
            tests/tournament-publication-unification.test.cjs \
            tests/rankings.test.cjs \
            tests/source-results-store.test.cjs \
            tests/source-results-split.test.cjs \
            tests/candidate-triage.test.cjs
      - name: Remove temporary publisher and diagnostic scripts before opening PR
        run: |
          rm scripts/aot-publish-37-temp.cjs scripts/aot-audit-37-temp.cjs
          rm .github/workflows/aot-publish-37-temp.yml .github/workflows/aot-audit-37-temp.yml
          node --test tests/workflow-inventory.test.cjs
      - name: Commit only inspected results and review report
        run: |
          set -euo pipefail
          git add -A source-results season-data review-reports
          git add history-sync-review.json history-sync-reviewed.json history-sync-status.json approval-history.json updates.json candidate-triage.json
          git add -u scripts/aot-publish-37-temp.cjs scripts/aot-audit-37-temp.cjs .github/workflows/aot-publish-37-temp.yml .github/workflows/aot-audit-37-temp.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: publish confirmed historical qualifiers and participation without duplicate payouts"
          git push origin HEAD:feat/publish-reviewed-37-fast-20261113
